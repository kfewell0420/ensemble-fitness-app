<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Daily Inspiration — Ensemble Fitness</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700;800;900&family=Caveat:wght@600;700&family=Dancing+Script:wght@600;700&display=swap">
<link rel="stylesheet" href="css/app.css?v=2" />
</head>
<body>

<!-- Ken's ask (Sept 2026): this page should NOT show the usual site-wide
     header/nav (logo, Community/My Journey/Gear/etc. links, Sign Out) —
     just the orange label, the heading/subtext, and the quote itself.
     Nov 2026 follow-up: the header still needs to exist as an EMPTY shell
     (no brand, no links) so js/notifications.js has an .app-nav to inject
     the home icon + notification bell into (see getUtilityGroup() there —
     it silently does nothing without one). Keeping the real .app-nav CSS
     class, rather than hand-rolling a one-off bar, is what gives this
     page the exact same header height/padding/icon spacing as every page
     that kept its full nav — consistency was the whole point of this ask.
     Nov 2026, round 2: that default .app-nav padding (meant to leave room
     for a full brand row + wrapping link grid) left a big empty gap above
     "Quote Library" once there was nothing in the header but the icons —
     Ken flagged this by comparing against books.html and music-library.html,
     which don't have this gap. Tightened to match books.html's own
     established "icons only, no brand/links" pattern (see its <style>
     block) — same padding values, just applied unconditionally here since
     this page never shows the brand/links at any width, unlike books.html
     which only hides them below 900px. -->
<header class="app-nav">
  <span class="app-nav-connect" aria-hidden="true">
    <svg viewBox="0 0 34 30" width="28" height="25" focusable="false">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="var(--pink, #db1f52)" transform="translate(0,2)"/>
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="var(--pink-2, #ff3d68)" stroke="var(--navy-900, #0b0f1a)" stroke-width="2.2" paint-order="stroke" transform="translate(13,9) scale(0.62)"/>
    </svg>
  </span>
</header>
<style>
  .app-nav {
    padding-top: calc(4px + env(safe-area-inset-top, 0px));
    padding-bottom: 4px;
  }
  .efit-nav-utility { margin-left: 0; margin-top: 0; }
  .app-shell { padding-top: 4px; }
</style>

<div class="app-shell">

  <!-- Ken's ask (Oct 2026): this used to be a "Quote Library" that dumped
     every active quote on the page at once — on his own phone it read as
     "it just literally spreads out everything I ever wrote," not the calm,
     one-thought-at-a-time feel the rest of the inspiration side of the app
     has. "This platform should be totally based on inspiration... it
     should be consistent" — the dashboard's sidebar panel (feed.html,
     rpQuotePanel) and the Explore list (find.html) both already say "Daily
     Inspiration," so this page's own label changes to match instead of
     calling itself something different ("Quote Library"). "Words to carry
     with you" stays exactly as is — Ken's explicit call, that heading is
     the part to keep. Below, the page now shows ONE quote — today's —
     using the exact same "days since the Unix epoch, modulo the queue
     length" math as feed.html's loadQuotePanel, so a member sees the same
     line here as on the dashboard, not a different one. admin.html's
     internal "Quote Library" tab name is unchanged — that's Ken's own
     backend tool, not member-facing, so the naming cleanup doesn't touch
     it. -->
  <div class="eyebrow">Daily Inspiration</div>
  <h2 style="margin-bottom:6px;">Words to carry with you.</h2>
  <p class="card-sub" style="margin-bottom:24px;">One line each day — something to hold onto before, during, or after your workout.</p>

  <div class="card" id="quoteCard" style="text-align:center; padding:40px 28px;">
    <div class="empty-state">Loading…</div>
  </div>

</div>

<!-- Ken's ask (Oct 2026): the "self-hosted copy, fall back to CDN" setup
     never actually had a self-hosted copy on disk (js/vendor/supabase.js
     was never created), so EVERY page load was silently failing that first
     request, then falling back to this exact CDN script via a blocking
     document.write (which stalls the page while it reruns) -- on every
     page, every load, website and app alike. That's the real reason things
     have felt slower since that change went in, not the CDN itself. Loading
     directly from the CDN, plainly, is both simpler and faster than the
     broken fallback dance was. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/shared-session.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/notifications.js"></script>
<script>
  var currentUser = null;

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  async function init() {
    currentUser = await requireAuth();
    if (!currentUser) return;

    // Ken's ask (Sept 2026): this page has no header/nav at all (see the
    // markup above), so there's no admin "Queue" link or Sign Out link on
    // this page to wire up — both were removed along with the header.
    await loadQuoteOfDay();
  }

  // ---- Quote of the day --------------------------------------------------
  // Ken's ask (Oct 2026, original): dropped the "record your own reading"
  // feature entirely — the message itself is what's relevant to the brand,
  // not a member's recording of it (see admin.html for the still-current
  // "add a quote" tool, which this reads from the same way it always has).
  //
  // Ken's ask (Oct 2026, round 2): this used to show every active quote at
  // once; now shows just today's, picked with the exact same math as
  // feed.html's loadQuotePanel (days since the Unix epoch, UTC, modulo the
  // number of quotes) — so a member gets the same single line here as on
  // the dashboard, and a new one shows up automatically at midnight with no
  // extra database column or scheduled job to maintain.
  async function loadQuoteOfDay() {
    var wrap = document.getElementById("quoteCard");
    var { data: quotes, error } = await window.sb
      .from("quotes")
      .select("quote_text, author")
      .eq("is_active", true)
      .order("created_at", { ascending: true });

    if (error) {
      wrap.innerHTML = '<div class="empty-state">Couldn\'t load today\'s line right now — please refresh.</div>';
      return;
    }
    if (!quotes || quotes.length === 0) {
      wrap.innerHTML = '<div class="empty-state">New quotes coming soon.</div>';
      return;
    }

    var q = quotes[Math.floor(Date.now() / 86400000) % quotes.length];
    wrap.innerHTML =
      (q.author ? '<div class="eyebrow" style="margin-bottom:16px;">' + escapeHtml(q.author) + "</div>" : "") +
      '<p style="font-size:22px; font-weight:600; font-style:italic; margin:0; line-height:1.5;">“' + escapeHtml(q.quote_text) + '”</p>';
  }

  init();
</script>
</body>
</html>
