<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>My Journey — Ensemble Fitness</title>
<link rel="stylesheet" href="css/fonts.css" onerror="this.onerror=null; this.href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700;800;900&family=Caveat:wght@600;700&family=Dancing+Script:wght@600;700&display=swap';">
<link rel="stylesheet" href="css/app.css?v=2" />
</head>
<body>

<!-- Ken's ask (Nov 2026): this page should NOT show the usual site-wide
     header/nav (logo, Community/My Journey/Gear/etc. links, Sign Out) —
     same treatment as quote-library.html and fitness-plus.html. The page
     should start right at the orange "Fitness Journey" eyebrow / "Your
     journal" heading below, which is already first in the markup.
     Nov 2026 follow-up: the header still needs to exist as an EMPTY shell
     (no brand, no links) so js/notifications.js has an .app-nav to inject
     the home icon + notification bell into — see quote-library.html's
     comment on this same change for the full reasoning.
     Nov 2026, round 2: tightened header/shell padding to match
     books.html's established "icons only" pattern — see quote-library.html's
     comment on this same follow-up for the full reasoning. -->
<header class="app-nav"></header>
<style>
  .app-nav {
    padding-top: calc(4px + env(safe-area-inset-top, 0px));
    padding-bottom: 4px;
  }
  .efit-nav-utility { margin-left: 0; margin-top: 0; }
  .app-shell { padding-top: 4px; }
</style>

<div class="app-shell">

  <div class="eyebrow">Fitness Journey</div>
  <h2 style="margin-bottom:6px;">Your journal</h2>
  <p class="card-sub" style="margin-bottom:24px;">A private log of your workouts and progress — only you (and admins, for support) can see these entries. No pressure, no streak-shaming — just a record of showing up.</p>

  <div class="card" style="margin-bottom:28px;">
    <form id="entryForm">
      <div class="field">
        <label for="je-date">Date</label>
        <input type="date" id="je-date" required />
      </div>
      <div class="field">
        <label for="je-activity">Activity</label>
        <input type="text" id="je-activity" placeholder="e.g. Leg day, 5k run, rest day" maxlength="80" />
      </div>
      <div class="field">
        <label for="je-mood">How did it feel?</label>
        <input type="text" id="je-mood" placeholder="e.g. Strong, tired, great" maxlength="40" />
      </div>
      <div class="field">
        <label for="je-notes">Notes</label>
        <textarea id="je-notes" placeholder="Anything you want to remember about today…" maxlength="500"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Add to Journey</button>
    </form>
  </div>

  <div class="eyebrow">History</div>
  <h2 style="font-size:18px; margin-bottom:16px;">Past entries</h2>
  <div class="card">
    <div id="entryList">
      <div class="empty-state">Loading…</div>
    </div>
  </div>

</div>

<script src="js/vendor/supabase.js"></script>
<script>
  // Ken's ask (Sept 2026): if the self-hosted copy of the Supabase library
  // is ever missing or fails to load (a deploy that didn't include
  // js/vendor/supabase.js, a bad path, etc.), fall back to loading it from
  // the CDN we used before, the same way this app worked for months,
  // instead of leaving sign-in broken. document.write here is intentional
  // and safe: it runs while the page is still being parsed, so the
  // injected <script> tag loads and finishes BEFORE the next script tags
  // (config.js, supabaseClient.js) run and need window.supabase to exist.
  if (!window.supabase) {
    document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"><\/script>');
  }
</script>
<script src="js/config.js"></script>
<script src="js/shared-session.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/notifications.js"></script>
<script>
  var currentUser = null;

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function formatDate(dateStr) {
    var d = new Date(dateStr + "T00:00:00");
    return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }

  async function loadEntries() {
    var el = document.getElementById("entryList");
    var { data, error } = await window.sb
      .from("journal_entries")
      .select("id, entry_date, activity, mood, notes, created_at")
      .eq("user_id", currentUser.id)
      .order("entry_date", { ascending: false })
      .order("created_at", { ascending: false });

    if (error) {
      el.innerHTML = '<div class="empty-state">Couldn\'t load your journey: ' + error.message + '</div>';
      return;
    }
    if (!data || data.length === 0) {
      el.innerHTML = '<div class="empty-state">No entries yet — add your first one above.</div>';
      return;
    }

    el.innerHTML = "";
    data.forEach(function (item) {
      var row = document.createElement("div");
      row.className = "review-row";
      row.innerHTML =
        '<div class="review-meta" style="flex:1;">' +
          '<strong>' + formatDate(item.entry_date) + (item.activity ? " · " + escapeHtml(item.activity) : "") + '</strong>' +
          (item.mood ? '<span>Felt: ' + escapeHtml(item.mood) + '</span>' : '') +
          (item.notes ? '<div style="font-size:13px; color:var(--muted-invert); margin-top:4px;">' + escapeHtml(item.notes) + '</div>' : '') +
        '</div>' +
        '<div class="review-actions">' +
          '<button class="btn btn-ghost btn-sm delete-entry-btn" data-id="' + item.id + '">Delete</button>' +
        '</div>';
      el.appendChild(row);
    });

    el.querySelectorAll(".delete-entry-btn").forEach(function (btn) {
      btn.addEventListener("click", async function () {
        if (!confirm("Delete this entry?")) return;
        btn.disabled = true;
        await window.sb.from("journal_entries").delete().eq("id", btn.getAttribute("data-id"));
        await loadEntries();
      });
    });
  }

  document.getElementById("entryForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    var date = document.getElementById("je-date").value;
    var activity = document.getElementById("je-activity").value.trim();
    var mood = document.getElementById("je-mood").value.trim();
    var notes = document.getElementById("je-notes").value.trim();
    if (!date) return;

    var submitBtn = e.target.querySelector("button[type=submit]");
    submitBtn.disabled = true;
    submitBtn.textContent = "Saving…";

    await window.sb.from("journal_entries").insert({
      user_id: currentUser.id,
      entry_date: date,
      activity: activity || null,
      mood: mood || null,
      notes: notes || null
    });

    e.target.reset();
    document.getElementById("je-date").value = new Date().toISOString().slice(0, 10);
    submitBtn.disabled = false;
    submitBtn.textContent = "Add to Journey";
    await loadEntries();
  });

  (async function init() {
    currentUser = await requireAuth();
    if (!currentUser) return;

    // Ken's ask (Nov 2026): this page has no header/nav at all (see the
    // markup above), so there's no admin "Queue" link or Sign Out link on
    // this page to wire up — both were removed along with the header.
    document.getElementById("je-date").value = new Date().toISOString().slice(0, 10);
    await loadEntries();
  })();
</script>

</body>
</html>
