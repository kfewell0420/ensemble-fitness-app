<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Reset Your Password — Ensemble Fitness</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700;800;900&family=Caveat:wght@600;700&family=Dancing+Script:wght@600;700&display=swap">
<link rel="stylesheet" href="css/app.css?v=2" />
</head>
<body>

<header class="app-nav">
  <a href="https://ensemblefitness.com" class="app-brand">
    <span class="app-brand-mark"><img src="assets/logo.png" alt="Ensemble Fitness" /></span>Ensemble Fitness
  </a>
  <span class="app-nav-connect" aria-hidden="true">
    <svg viewBox="0 0 34 30" width="28" height="25" focusable="false">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="var(--pink, #db1f52)" transform="translate(0,2)"/>
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="var(--pink-2, #ff3d68)" stroke="var(--navy-900, #0b0f1a)" stroke-width="2.2" paint-order="stroke" transform="translate(13,9) scale(0.62)"/>
    </svg>
  </span>
</header>

<div class="app-shell narrow">
  <div class="eyebrow" style="text-align:center;">Member Area</div>
  <h1 style="text-align:center; font-size:26px;">Reset Your Password</h1>
  <p style="text-align:center; margin-bottom:28px;" id="introText">Choose a new password below.</p>

  <div class="card">
    <div class="form-msg" id="formMsg"></div>

    <form id="resetForm">
      <div class="field">
        <label for="newPassword">New password</label>
        <div class="password-field-wrap">
          <input type="password" id="newPassword" name="newPassword" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password" />
          <button type="button" class="password-toggle" id="toggleNewPassword" aria-label="Show password">👁</button>
        </div>
      </div>
      <div class="field">
        <label for="confirmNewPassword">Confirm new password</label>
        <div class="password-field-wrap">
          <input type="password" id="confirmNewPassword" name="confirmNewPassword" placeholder="Re-enter your new password" required minlength="8" autocomplete="new-password" />
          <button type="button" class="password-toggle" id="toggleConfirmNewPassword" aria-label="Show password">👁</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Set New Password</button>
    </form>

    <p style="text-align:center; font-size:12.5px; margin-top:16px;">
      <a href="login.html" style="color:var(--accent-2); font-weight:700;">Back to Sign In</a>
    </p>
  </div>
</div>

<!-- Ken's ask (Oct 2026): the "self-hosted copy, fall back to CDN" setup
     never actually had a self-hosted copy on disk (js/vendor/supabase.js
     was never created), so EVERY page load was silently failing that first
     request, then falling back to this exact CDN script via a blocking
     document.write (which stalls the page while it reruns) -- on every
     page, every load, website and app alike. That's the real reason things
     have felt slower since that change went in, not the CDN itself. Loading
     directly from the CDN, plainly, is both simpler and faster than the
     broken fallback dance was. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/shared-session.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/notifications.js"></script>
<script>
  var formMsg = document.getElementById("formMsg");
  var introText = document.getElementById("introText");
  var submitBtn = document.getElementById("submitBtn");
  var resetForm = document.getElementById("resetForm");
  var newPasswordInput = document.getElementById("newPassword");
  var confirmNewPasswordInput = document.getElementById("confirmNewPassword");
  var hasRecoverySession = false;

  wirePasswordToggle(document.getElementById("toggleNewPassword"), newPasswordInput);
  wirePasswordToggle(document.getElementById("toggleConfirmNewPassword"), confirmNewPasswordInput);

  function showMsg(text, kind) {
    formMsg.textContent = text;
    formMsg.className = "form-msg show " + kind;
  }

  // Clicking the link in the password-reset email lands here carrying a recovery token in
  // the URL (Supabase's JS client reads it automatically on load, then fires this event and
  // establishes a temporary session that's only good for setting a new password).
  window.sb.auth.onAuthStateChange(function (event) {
    if (event === "PASSWORD_RECOVERY") {
      hasRecoverySession = true;
    }
  });

  // If someone lands here directly (not from a reset email), there's no recovery session —
  // send them back to sign in rather than showing a form that can't work.
  setTimeout(async function () {
    if (hasRecoverySession) return;
    var { data } = await window.sb.auth.getSession();
    if (!data.session) {
      introText.textContent = "This link is invalid or has expired.";
      resetForm.style.display = "none";
      showMsg("Please request a new password reset link from the sign-in page.", "error");
    }
  }, 1500);

  resetForm.addEventListener("submit", async function (e) {
    e.preventDefault();
    var newPassword = newPasswordInput.value;
    var confirmNewPassword = confirmNewPasswordInput.value;

    if (newPassword !== confirmNewPassword) {
      showMsg("Those passwords don't match — please re-enter them so both are the same.", "error");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Saving…";

    try {
      var { error } = await window.sb.auth.updateUser({ password: newPassword });
      if (error) throw error;
      showMsg("Your password has been updated! Redirecting you to your profile…", "success");
      setTimeout(function () { window.location.href = "profile.html"; }, 1800);
    } catch (err) {
      showMsg(err.message || "Couldn't update your password. Please request a new reset link and try again.", "error");
      submitBtn.disabled = false;
      submitBtn.textContent = "Set New Password";
    }
  });
</script>

</body>
</html>
