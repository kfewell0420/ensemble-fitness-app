<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Find Members — Ensemble Fitness</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700;800;900&family=Caveat:wght@600;700&family=Dancing+Script:wght@600;700&display=swap">
<link rel="stylesheet" href="css/app.css?v=4" />
</head>
<body>

<!-- Ken's ask (Nov 2026): this page should NOT show the usual site-wide
     header/nav (logo, Community/My Journey/Gear/etc. links, Sign Out) —
     same treatment as quote-library.html, fitness-plus.html, journey.html,
     fitness-journeys.html, and gear.html. The page should start right at
     the orange "Community" eyebrow / "Find Members Near You" heading
     below, which is already first in the markup.
     Nov 2026 follow-up: the header still needs to exist as an EMPTY shell
     (no brand, no links) so js/notifications.js has an .app-nav to inject
     the home icon + notification bell into — see quote-library.html's
     comment on this same change for the full reasoning.
     Nov 2026, round 2: tightened header/shell padding to match
     books.html's established "icons only" pattern — see quote-library.html's
     comment on this same follow-up for the full reasoning. -->
<header class="app-nav">
  <span class="app-nav-connect" aria-hidden="true">
    <svg viewBox="0 0 34 30" width="28" height="25" focusable="false">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="var(--pink, #db1f52)" transform="translate(0,2)"/>
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="var(--pink-2, #ff3d68)" stroke="var(--navy-900, #0b0f1a)" stroke-width="2.2" paint-order="stroke" transform="translate(13,9) scale(0.62)"/>
    </svg>
  </span>
</header>
<style>
  .app-nav {
    padding-top: calc(4px + env(safe-area-inset-top, 0px));
    padding-bottom: 4px;
  }
  .efit-nav-utility { margin-left: 0; margin-top: 0; }
  .app-shell { padding-top: 4px; }
</style>

<div class="app-shell">

  <div class="eyebrow">Community</div>
  <h2 style="margin-bottom:6px;">Find Members Near You</h2>
  <p class="card-sub" style="margin-bottom:24px;">Meet other Ensemble Fitness members. Enter a ZIP code to find people near you.</p>

  <div data-conn-key style="margin-bottom:16px;"></div>

  <div class="card">
    <div class="form-msg" id="searchMsg"></div>
    <div style="display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap;">
      <div class="field" style="flex:1; min-width:160px; margin-bottom:0;">
        <label for="zipSearch">Narrow by ZIP code (optional)</label>
        <input type="text" id="zipSearch" inputmode="numeric" pattern="[0-9]{3,5}" maxlength="5" placeholder="e.g. 76002, or just 760" autocomplete="postal-code" />
      </div>
      <button type="button" class="btn btn-primary" id="searchBtn">Search</button>
    </div>
    <button type="button" class="btn btn-ghost btn-sm" id="showAllBtn" style="display:none; margin-top:12px;">Show all members</button>
  </div>

  <div class="card">
    <div id="memberResults">
      <div class="empty-state">Loading members…</div>
    </div>
  </div>

</div>

<!-- Ken's ask (Oct 2026): the "self-hosted copy, fall back to CDN" setup
     never actually had a self-hosted copy on disk (js/vendor/supabase.js
     was never created), so EVERY page load was silently failing that first
     request, then falling back to this exact CDN script via a blocking
     document.write (which stalls the page while it reruns) -- on every
     page, every load, website and app alike. That's the real reason things
     have felt slower since that change went in, not the CDN itself. Loading
     directly from the CDN, plainly, is both simpler and faster than the
     broken fallback dance was. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/shared-session.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/notifications.js"></script>
<script src="js/moderation.js"></script>
<script>
  var currentUser = null;
  var currentUserWakeTime = "";

  function showMsg(el, text, kind) {
    el.textContent = text;
    el.className = "form-msg show " + kind;
  }
  function hideMsg(el) { el.className = "form-msg"; }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  async function avatarUrlFor(userId) {
    var { data } = await window.sb
      .from("media")
      .select("storage_path")
      .eq("user_id", userId)
      .eq("is_profile_photo", true)
      .eq("status", "approved")
      .order("created_at", { ascending: false })
      .limit(1)
      .maybeSingle();
    if (!data) return "";
    var { data: signed } = await window.sb.storage.from("media").createSignedUrl(data.storage_path, 3600);
    return signed ? signed.signedUrl : "";
  }

  // Browse-first member directory (Ken, Oct 12 2026): the page used to REQUIRE a ZIP code and
  // opened locked to the viewer's own, so members only saw people in that exact ZIP. Now it opens
  // on everyone (people in your own ZIP first, then the rest A–Z), 30 at a time. The ZIP box is an
  // optional narrow-down and takes 3–5 digits: "760" matches every 760xx ZIP, "76002" just that one.
  var PAGE_SIZE = 30;
  var myZip = "";
  var activeZip = "";     // "" = browsing everyone
  var othersOffset = 0;   // paging position in the "everyone else" list
  var loadSeq = 0;        // guards against two overlapping loads landing out of order

  function buildMemberRow(member, avatarUrl, connStatus) {
    var row = document.createElement("div");
    row.className = "member-row member-row-clickable";
    row.setAttribute("role", "button");
    row.setAttribute("tabindex", "0");
    row.setAttribute("aria-label", "View " + (member.display_name || "member") + "'s profile");

    var initial = (member.display_name || "?").trim().charAt(0).toUpperCase() || "?";
    var avatarInner = avatarUrl ? '<img src="' + avatarUrl + '" alt="' + escapeHtml(member.display_name || "Member") + '" />' : initial;
    var wakeLabel = wakeTimeLabel(member.wake_time_category);
    var sameWakeTime = !!currentUserWakeTime && member.wake_time_category === currentUserWakeTime;
    var sameZip = !!myZip && member.zip_code === myZip;

    row.innerHTML =
      '<div class="avatar-circle">' + avatarInner + '</div>' +
      '<div class="member-row-meta">' +
        '<strong>' + escapeHtml(member.display_name || "A member") + connectionBadgeHtml(connStatus) + '</strong>' +
        (member.bio ? '<p>' + escapeHtml(member.bio) + '</p>' : '') +
        '<span>' + (member.zip_code ? 'ZIP ' + escapeHtml(member.zip_code) : '') + (wakeLabel ? (member.zip_code ? ' · ' : '') + escapeHtml(wakeLabel) : '') + '</span>' +
        (sameZip ? '<span style="display:block; color:var(--accent-2); font-weight:700; margin-top:3px;">📍 Same ZIP code as you</span>' : '') +
        (sameWakeTime ? '<span style="display:block; color:var(--accent-2); font-weight:700; margin-top:3px;">🌞 Same wake-up time as you</span>' : '') +
      '</div>';

    row.addEventListener("click", function () {
      window.location.href = "member.html?id=" + encodeURIComponent(member.id);
    });
    row.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        window.location.href = "member.html?id=" + encodeURIComponent(member.id);
      }
    });
    return row;
  }

  // Appends rows for `members` to the list (avatars + badges fetched together, concurrently).
  async function appendMembers(container, members) {
    var fetched = await Promise.all([
      Promise.all(members.map(function (m) { return avatarUrlFor(m.id); })),
      fetchConnectionStatuses(members.map(function (m) { return m.id; }))
    ]);
    for (var i = 0; i < members.length; i++) {
      container.appendChild(buildMemberRow(members[i], fetched[0][i], fetched[1][members[i].id]));
    }
  }

  var MEMBER_COLS = "id, display_name, bio, zip_code, wake_time_category";

  // reset=true starts a fresh list (first load, a search, or "Show all"); false appends the next page.
  async function loadMembers(reset) {
    var results = document.getElementById("memberResults");
    var msg = document.getElementById("searchMsg");
    var searchBtn = document.getElementById("searchBtn");
    var seq = ++loadSeq;
    searchBtn.disabled = true;
    if (reset) {
      hideMsg(msg);
      othersOffset = 0;
      results.innerHTML = '<div class="empty-state">Loading members…</div>';
    }
    var moreBtn = document.getElementById("showMoreBtn");
    if (moreBtn) { moreBtn.disabled = true; moreBtn.textContent = "Loading…"; }

    try {
      var batch = [];     // members to show now, in display order
      var rawCount = 0;   // size of the "others" page before block-filtering (decides if more exist)

      if (activeZip) {
        var q = window.sb.from("profiles").select(MEMBER_COLS).neq("id", currentUser.id);
        q = activeZip.length === 5 ? q.eq("zip_code", activeZip) : q.like("zip_code", activeZip + "%");
        var res = await q.order("display_name", { ascending: true }).range(othersOffset, othersOffset + PAGE_SIZE - 1);
        if (res.error) throw res.error;
        batch = res.data || [];
        rawCount = batch.length;
      } else {
        // Browse mode: people in the viewer's own ZIP first (first page only), then everyone else A–Z.
        if (reset && myZip) {
          var same = await window.sb.from("profiles").select(MEMBER_COLS)
            .eq("zip_code", myZip).neq("id", currentUser.id)
            .order("display_name", { ascending: true }).limit(100);
          if (!same.error && same.data) batch = batch.concat(same.data);
        }
        var oq = window.sb.from("profiles").select(MEMBER_COLS).neq("id", currentUser.id);
        if (myZip) oq = oq.or("zip_code.is.null,zip_code.neq." + myZip);
        var ores = await oq.order("display_name", { ascending: true }).range(othersOffset, othersOffset + PAGE_SIZE - 1);
        if (ores.error) throw ores.error;
        rawCount = (ores.data || []).length;
        batch = batch.concat(ores.data || []);
      }
      if (seq !== loadSeq) return; // a newer load started — drop this one

      othersOffset += rawCount;
      // Blocked members never show up in the directory.
      batch = filterOutBlocked(batch, "id");

      if (reset) results.innerHTML = "";
      var oldMore = document.getElementById("showMoreBtn");
      if (oldMore) oldMore.remove();

      if (reset && !batch.length) {
        results.innerHTML = activeZip
          ? '<div class="empty-state">No members found in ZIP ' + escapeHtml(activeZip) + (activeZip.length < 5 ? '…' : '') + ' yet. Try fewer digits, or tap "Show all members".</div>'
          : '<div class="empty-state">No other members yet — check back soon as more people join.</div>';
        return;
      }
      await appendMembers(results, batch);
      if (seq !== loadSeq) return;

      if (rawCount === PAGE_SIZE) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn btn-ghost btn-block";
        btn.id = "showMoreBtn";
        btn.style.marginTop = "14px";
        btn.textContent = "Show more members";
        btn.addEventListener("click", function () { loadMembers(false); });
        results.appendChild(btn);
      }
    } catch (err) {
      if (seq === loadSeq) {
        if (reset) results.innerHTML = '<div class="empty-state">Couldn\'t load members. Please try again.</div>';
        var mb = document.getElementById("showMoreBtn");
        if (mb) { mb.disabled = false; mb.textContent = "Show more members"; }
      }
    } finally {
      if (seq === loadSeq) searchBtn.disabled = false;
    }
  }

  function runSearch() {
    var msg = document.getElementById("searchMsg");
    var zip = document.getElementById("zipSearch").value.trim();
    var showAll = document.getElementById("showAllBtn");
    if (zip === "") {            // empty box = back to everyone
      activeZip = "";
      showAll.style.display = "none";
      loadMembers(true);
      return;
    }
    if (!/^[0-9]{3,5}$/.test(zip)) {
      showMsg(msg, "Enter 3 to 5 digits of a ZIP code (for example 760 or 76002).", "error");
      return;
    }
    activeZip = zip;
    showAll.style.display = "inline-block";
    loadMembers(true);
  }

  document.getElementById("searchBtn").addEventListener("click", runSearch);
  document.getElementById("zipSearch").addEventListener("keydown", function (e) {
    if (e.key === "Enter") runSearch();
  });
  document.getElementById("showAllBtn").addEventListener("click", function () {
    document.getElementById("zipSearch").value = "";
    runSearch();
  });

  (async function init() {
    currentUser = await requireAuth();
    if (!currentUser) return;
    setModerationUser(currentUser.id);
    await loadBlockedIds();

    // Ken's ask (Nov 2026): this page has no header/nav at all (see the
    // markup above), so there's no admin "Queue" link or Sign Out link on
    // this page to wire up — both were removed along with the header.

    // The viewer's own ZIP is used only to list their neighbors first and tag them —
    // the ZIP box itself starts empty so everyone is visible.
    var { data } = await window.sb
      .from("profiles")
      .select("zip_code, wake_time_category")
      .eq("id", currentUser.id)
      .maybeSingle();
    if (data) {
      currentUserWakeTime = data.wake_time_category || "";
      myZip = data.zip_code || "";
    }
    await loadMembers(true);
  })();
</script>

</body>
</html>
