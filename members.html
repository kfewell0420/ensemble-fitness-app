<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Find Members — Ensemble Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=2" />
</head>
<body>

<!-- Ken's ask (Nov 2026): this page should NOT show the usual site-wide
     header/nav (logo, Community/My Journey/Gear/etc. links, Sign Out) —
     same treatment as quote-library.html, fitness-plus.html, journey.html,
     fitness-journeys.html, and gear.html. The page should start right at
     the orange "Community" eyebrow / "Find Members Near You" heading
     below, which is already first in the markup.
     Nov 2026 follow-up: the header still needs to exist as an EMPTY shell
     (no brand, no links) so js/notifications.js has an .app-nav to inject
     the home icon + notification bell into — see quote-library.html's
     comment on this same change for the full reasoning.
     Nov 2026, round 2: tightened header/shell padding to match
     books.html's established "icons only" pattern — see quote-library.html's
     comment on this same follow-up for the full reasoning. -->
<header class="app-nav"></header>
<style>
  .app-nav {
    padding-top: calc(4px + env(safe-area-inset-top, 0px));
    padding-bottom: 4px;
  }
  .efit-nav-utility { margin-left: 0; margin-top: 0; }
  .app-shell { padding-top: 4px; }
</style>

<div class="app-shell">

  <div class="eyebrow">Community</div>
  <h2 style="margin-bottom:6px;">Find Members Near You</h2>
  <p class="card-sub" style="margin-bottom:24px;">Search by ZIP code to find other Ensemble Fitness members in your area — optionally narrow it down to members who naturally wake up around the same time as you.</p>

  <div class="card">
    <div class="form-msg" id="searchMsg"></div>
    <div style="display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap;">
      <div class="field" style="flex:1; min-width:160px; margin-bottom:0;">
        <label for="zipSearch">ZIP code</label>
        <input type="text" id="zipSearch" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" placeholder="e.g. 75201" autocomplete="postal-code" />
      </div>
      <div class="field" style="flex:1; min-width:200px; margin-bottom:0;">
        <label for="wakeTimeFilter">Wake-up time</label>
        <select id="wakeTimeFilter"></select>
      </div>
      <button type="button" class="btn btn-primary" id="searchBtn">Search</button>
    </div>
  </div>

  <div class="card">
    <div id="memberResults">
      <div class="empty-state">Enter a ZIP code above to see members near you.</div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/shared-session.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/notifications.js"></script>
<script src="js/moderation.js"></script>
<script>
  var currentUser = null;
  var currentUserWakeTime = "";

  function showMsg(el, text, kind) {
    el.textContent = text;
    el.className = "form-msg show " + kind;
  }
  function hideMsg(el) { el.className = "form-msg"; }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  async function avatarUrlFor(userId) {
    var { data } = await window.sb
      .from("media")
      .select("storage_path")
      .eq("user_id", userId)
      .eq("is_profile_photo", true)
      .eq("status", "approved")
      .order("created_at", { ascending: false })
      .limit(1)
      .maybeSingle();
    if (!data) return "";
    var { data: signed } = await window.sb.storage.from("media").createSignedUrl(data.storage_path, 3600);
    return signed ? signed.signedUrl : "";
  }

  async function runSearch() {
    var msg = document.getElementById("searchMsg");
    var results = document.getElementById("memberResults");
    hideMsg(msg);

    var zip = document.getElementById("zipSearch").value.trim();
    if (!/^[0-9]{5}$/.test(zip)) {
      showMsg(msg, "Please enter a valid 5-digit ZIP code.", "error");
      return;
    }

    var wakeFilter = document.getElementById("wakeTimeFilter").value;

    results.innerHTML = '<div class="empty-state">Searching…</div>';

    var query = window.sb
      .from("profiles")
      .select("id, display_name, bio, zip_code, wake_time_category")
      .eq("zip_code", zip)
      .neq("id", currentUser.id);

    if (wakeFilter) query = query.eq("wake_time_category", wakeFilter);

    var { data, error } = await query.order("display_name", { ascending: true });

    if (error) {
      results.innerHTML = '<div class="empty-state">Couldn\'t load results. Please try again.</div>';
      return;
    }

    // Blocked members never show up in search results.
    data = filterOutBlocked(data || [], "id");

    if (!data || data.length === 0) {
      results.innerHTML = '<div class="empty-state">No members found in ZIP ' + escapeHtml(zip) + (wakeFilter ? " with that wake-up time" : "") + ' yet. Try a nearby ZIP code or a different wake-up time, or check back later as more members join.</div>';
      return;
    }

    results.innerHTML = "";
    for (var i = 0; i < data.length; i++) {
      var member = data[i];
      var row = document.createElement("div");
      row.className = "member-row member-row-clickable";
      row.setAttribute("role", "button");
      row.setAttribute("tabindex", "0");
      row.setAttribute("aria-label", "View " + (member.display_name || "member") + "'s profile");

      var avatarUrl = await avatarUrlFor(member.id);
      var initial = (member.display_name || "?").trim().charAt(0).toUpperCase() || "?";
      var avatarInner = avatarUrl ? '<img src="' + avatarUrl + '" alt="' + escapeHtml(member.display_name || "Member") + '" />' : initial;

      var wakeLabel = wakeTimeLabel(member.wake_time_category);
      var sameWakeTime = !!currentUserWakeTime && member.wake_time_category === currentUserWakeTime;

      row.innerHTML =
        '<div class="avatar-circle">' + avatarInner + '</div>' +
        '<div class="member-row-meta">' +
          '<strong>' + escapeHtml(member.display_name || "A member") + '</strong>' +
          (member.bio ? '<p>' + escapeHtml(member.bio) + '</p>' : '') +
          '<span>ZIP ' + escapeHtml(member.zip_code) + (wakeLabel ? ' · ' + escapeHtml(wakeLabel) : '') + '</span>' +
          (sameWakeTime ? '<span style="display:block; color:var(--accent-2); font-weight:700; margin-top:3px;">🌞 Same wake-up time as you</span>' : '') +
        '</div>';

      (function (memberId) {
        row.addEventListener("click", function () {
          window.location.href = "member.html?id=" + encodeURIComponent(memberId);
        });
        row.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            window.location.href = "member.html?id=" + encodeURIComponent(memberId);
          }
        });
      })(member.id);

      results.appendChild(row);
    }
  }

  document.getElementById("searchBtn").addEventListener("click", runSearch);
  document.getElementById("zipSearch").addEventListener("keydown", function (e) {
    if (e.key === "Enter") runSearch();
  });
  document.getElementById("wakeTimeFilter").addEventListener("keydown", function (e) {
    if (e.key === "Enter") runSearch();
  });

  (async function init() {
    currentUser = await requireAuth();
    if (!currentUser) return;
    setModerationUser(currentUser.id);
    await loadBlockedIds();

    // Ken's ask (Nov 2026): this page has no header/nav at all (see the
    // markup above), so there's no admin "Queue" link or Sign Out link on
    // this page to wire up — both were removed along with the header.

    document.getElementById("wakeTimeFilter").innerHTML = buildWakeTimeOptionsHtml("Any");

    // Prefill with the member's own ZIP code (if they've set one) and search right away.
    var { data } = await window.sb
      .from("profiles")
      .select("zip_code, wake_time_category")
      .eq("id", currentUser.id)
      .maybeSingle();
    if (data) {
      currentUserWakeTime = data.wake_time_category || "";
      if (data.zip_code) {
        document.getElementById("zipSearch").value = data.zip_code;
        await runSearch();
      }
    }
  })();
</script>

</body>
</html>
