    },
    {
      name: "Denise", age: 52, file: "mealprep-denise.jpg",
      caption: "Prep time: 15 minutes\n\nSpring mix, grilled salmon, cherry tomatoes, and a lemon vinaigrette I make in bulk.\n\nI wash and chop all the greens for the week in one sitting on Sunday nights.\n\nThe salmon gets pan-seared just before I eat it — never microwaved, always fresh.\n\nA drizzle of the vinaigrette right before serving keeps everything crisp.\n\nFifteen minutes, start to finish, most days.\n\nMy skin and my energy have both noticed the difference.",
      signature: "Denise",
      reactions: { thumbs_up: 19, muscle: 6, heart: 33 },
      comments: [
        { name: "Angela", age: 47, body: "Making the vinaigrette in bulk is such a good idea." }
      ]
    },
    {
      name: "Priya", age: 29, file: "mealprep-priya.jpg",
      caption: "Prep time: 5 minutes\n\nFrozen mango, spinach, a scoop of protein powder, and oat milk.\n\nI pre-portion the fruit and greens into freezer bags on Sunday so mornings are fast.\n\nBlend for about 45 seconds until it's completely smooth, no chunks.\n\nI add a spoonful of peanut butter when I need the extra fuel.\n\nWhole thing takes five minutes, including cleanup.\n\nI've had a version of this every morning for six months straight.",
      signature: "Priya",
      reactions: { thumbs_up: 27, muscle: 20, heart: 38 },
      comments: [
        { name: "Marcus", age: 44, body: "Freezer bags on Sunday is the move. Doing this from now on." },
        { name: "James", age: 38, body: "Adding peanut butter to mine tomorrow morning." }
      ]
    },
    {
      name: "James", age: 38, file: "mealprep-james.jpg",
      caption: "Prep time: 10 minutes\n\nTwo eggs, whole wheat toast, and half an avocado.\n\nI boil a batch of eggs on Sunday so all I have to do is toast and slice in the morning.\n\nMash the avocado right on the toast with a little salt and chili flakes.\n\nSome mornings I add a side of berries if I have them.\n\nTakes about ten minutes even on my slowest days.\n\nSwapping my old cereal-and-coffee breakfast for this changed my whole morning.",
      signature: "James",
      reactions: { thumbs_up: 14, muscle: 5, heart: 22 },
      comments: [
        { name: "Denise", age: 52, body: "Boiling a batch of eggs on Sunday is such a simple win." }
      ]
    },
    {
      name: "Tyler", age: 26, file: "mealprep-tyler.jpg",
      caption: "Prep time: 45 minutes (Sunday batch)\n\nTurkey meatballs, roasted broccoli, and sweet potato, split into five containers.\n\nI roast everything on one sheet pan to keep cleanup simple.\n\nMeatballs bake for 20 minutes at 400° while the vegetables roast alongside them.\n\nI portion it all out Sunday night so the whole week is already decided.\n\nForty-five minutes once a week beats scrambling every single night.\n\nNo excuses, no drive-thru — it's already in the fridge.",
      signature: "Tyler",
      reactions: { thumbs_up: 21, muscle: 24, heart: 29 },
      comments: [
        { name: "Marcus", age: 44, body: "One sheet pan, zero excuses. Love it." },
        { name: "Priya", age: 29, body: "Five containers ready for the week — goals." }
      ]
    },
    {
      name: "Angela", age: 47, file: "mealprep-angela.jpg",
      caption: "Prep time: 5 minutes\n\nFrozen strawberries, banana, spinach, and a scoop of collagen powder.\n\nI keep pre-bagged smoothie packs in the freezer so there's zero morning decision-making.\n\nBlend with almond milk until smooth — about a minute, tops.\n\nSome days I add a spoonful of oats to keep me full longer.\n\nFive minutes and I'm out the door.\n\nThree months of this every morning, and I genuinely feel like a different person.",
      signature: "Angela",
      reactions: { thumbs_up: 17, muscle: 8, heart: 35 },
      comments: [
        { name: "Denise", age: 52, body: "Pre-bagged smoothie packs are a game changer for mornings." }
      ]
    }
  ];
  // How many cards the Healthy Meal Prep strip always shows, real posts
  // plus illustrative filler combined — see composeMealPrepStrip below.
  // Matches ILLUSTRATIVE_MEAL_PREP's own length (6 examples) on purpose.
  var MEAL_PREP_STRIP_SIZE = 6;
  // The real (non-illustrative) approved Meal Prep posts fetched so far,
  // newest first — kept separate from mealPrepItems (the actual rendered
  // strip) so a live update can recompute the padded/mixed strip without
  // losing track of how many real posts actually exist.
  var mealPrepRealItems = [];
  function buildIllustrativeMealPrepItem(i) {
    var it = ILLUSTRATIVE_MEAL_PREP[i];
    return {
      id: "illustrative-" + i,
      user_id: "",
      kind: "photo",
      url: "assets/mealprep/" + it.file,
      posterUrl: "",
      name: it.name,
      created_at: new Date().toISOString(),
      workout_type: "Meal Prep",
      location: "",
      caption: it.caption,
      signature: it.signature || "",
      age: it.age || null,
      illustrativeReactions: it.reactions || null,
      illustrativeComments: it.comments || null
    };
  }
  // Ken's ask (Sept 2026): the strip should always host MEAL_PREP_STRIP_SIZE
  // (6) cards. Real approved posts (newest first) fill as many of those
  // slots as exist; whatever's left over is padded out with the
  // illustrative examples, so a member uploading their first real post
  // bumps ONE illustrative card off the end instead of wiping out all six
  // at once — which is exactly what happened before this fix: the strip
  // went from 6 example avatars straight down to just the 1 new real
  // photo. As more real posts get approved, they keep pushing illustrative
  // filler off the end one slot at a time until eventually all 6 are real.
  function composeMealPrepStrip(realItems) {
    var real = realItems.slice(0, MEAL_PREP_STRIP_SIZE);
    var fillerNeeded = MEAL_PREP_STRIP_SIZE - real.length;
    var filler = [];
    for (var i = 0; i < fillerNeeded && i < ILLUSTRATIVE_MEAL_PREP.length; i++) {
      filler.push(buildIllustrativeMealPrepItem(i));
    }
    return real.concat(filler);
  }
  // Newest real (non-illustrative) Meal Prep post's created_at, for the
  // live-update check below — stays null while only illustrative
  // placeholders are showing, since those aren't real timestamps to
  // compare against.
  var newestMealPrepSeenAt = null;

  function renderFilters() {
    var wrap = document.getElementById("rpFilters");
    wrap.innerHTML = CATEGORY_FILTERS.map(function (label) {
      return '<button type="button" class="rp-filter-chip' + (label === activeFilter ? " active" : "") + '" data-filter="' + escapeHtml(label) + '">' +
        (CATEGORY_ICONS[label] ? CATEGORY_ICONS[label] + " " : "") + escapeHtml(label) +
        '</button>';
    }).join("");
    wrap.querySelectorAll(".rp-filter-chip").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var filter = btn.dataset.filter;
        if (filter === activeFilter) return;
        activeFilter = filter;
        renderFilters();
        resetReel();
      });
    });
  }

  function resetReel() {
    var reel = document.getElementById("rpReel");
    var sentinel = document.getElementById("rpSentinel");
    reel.classList.toggle("rp-reel-list", activeFilter === "Journeys");
    reel.querySelectorAll(".rp-slide, .rp-empty-reel").forEach(function (el) { el.remove(); });
    loadedItems = [];
    offset = 0;
    journalOffset = 0;
    reachedEnd = false;
    journalReachedEnd = false;
    newestSeenAt = null;
    reel.scrollTop = 0;
    if (sentinel) reel.appendChild(sentinel); // keep sentinel last so infinite-scroll still fires
    loadMoreReel();
  }

  var REACTIONS = [
    { type: "thumbs_up" },
    { type: "muscle" },
    { type: "heart" }
  ];

  // Journey (community_questions) posts use their own reactions table —
  // story_reactions — shared with the marketing site's Fitness Journeys
  // page and homepage widget, so a cheer given here or there shows up in
  // both places. The allowed values there are clap/heart/thumbs_up (see
  // sql/schema.sql section 6c), not the same set as media reactions above.
  var STORY_REACTIONS = [
    { type: "clap" },
    { type: "heart" },
    { type: "thumbs_up" }
  ];

  // Hand-drawn vector icons replacing the old plain-emoji reactions — OS
  // emoji render in a fixed color (that stock yellow-gold hand/arm), which
  // is exactly what blended into the orange "active" fill Ken flagged.
  // These use currentColor, so their color is 100% ours to control, they
  // stay crisp at small sizes (unlike emoji, which get muddy shrunk down),
  // and they render identically on every device instead of varying by OS.
  // thumbs_up/heart swap to a solid "filled" variant when active, mirroring
  // Instagram's own heart-fills-in-when-liked behavior; muscle/clap/comment
  // are simple constant glyphs whose color changes with state instead.
  var REACTION_ICONS = {
    // Replaced the old hand-built outline (3 separate paths that didn't
    // quite meet up — looked "messy"/uneven under any zoom, per Ken) with
    // a single well-formed path (same one used for both states, just
    // toggling fill vs. stroke) so the linework is actually clean.
    thumbs_up: {
      outline: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>',
      active: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>'
    },
    heart: {
      outline: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.2s-7.05-4.4-9.4-8.55C1.1 9.1 1.85 5.7 4.6 4.3c2.15-1.1 4.7-.5 6.15 1.35L12 7.05l1.25-1.4c1.45-1.85 4-2.45 6.15-1.35 2.75 1.4 3.5 4.8 2 7.35C19.05 15.8 12 20.2 12 20.2Z"/></svg>',
      active: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.2s-7.05-4.4-9.4-8.55C1.1 9.1 1.85 5.7 4.6 4.3c2.15-1.1 4.7-.5 6.15 1.35L12 7.05l1.25-1.4c1.45-1.85 4-2.45 6.15-1.35 2.75 1.4 3.5 4.8 2 7.35C19.05 15.8 12 20.2 12 20.2Z"/></svg>'
    },
    // A hand-drawn "flexed bicep" silhouette (fist + forearm + bulge, or
    // circle/rect combinations) was tried several times and always read as
    // an unrecognizable blob at the ~17px this actually renders at — fine
    // in a big 60px test swatch, meaningless at real size (Ken: "not
    // clean"). A dumbbell before that wasn't a muscle at all. The native
    // 💪 emoji is the one thing that's instantly, unambiguously readable
    // at tiny sizes — it's professionally drawn and hinted for exactly
    // this. It renders in its own fixed color rather than currentColor
    // (see the .rp-action-btn.active[data-reaction="muscle"] overrides
    // below, which swap the old solid accent-color fill for a ring so
    // that fixed color never sits on top of a clashing solid background).
    muscle: {
      outline: '💪',
      active: '💪'
    },
    // A real 5-point star, not a sparkle burst — Ken: bright yellow, an
    // actual star reads better and "people gravitate towards that."
    clap: {
      outline: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>'
    }
  };
  var COMMENT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.4 8.4c-1.28 0-2.5-.28-3.6-.79L3 21l1.9-5.7a8.3 8.3 0 0 1-.8-3.6A8.4 8.4 0 0 1 12.5 3.2a8.4 8.4 0 0 1 8.5 8.3Z"/></svg>';

  function reactionIconMarkup(type, active) {
    var icon = REACTION_ICONS[type];
    if (!icon) return "";
    return (active && icon.active) ? icon.active : icon.outline;
  }
  function setReactionIcon(btn, type, active) {
    var el = btn.querySelector(".rp-action-icon");
    if (el) el.innerHTML = reactionIconMarkup(type, active);
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function timeAgo(iso) {
    var diffMs = Math.max(0, Date.now() - new Date(iso).getTime());
    var mins = Math.floor(diffMs / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + "m ago";
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + "h ago";
    var days = Math.floor(hrs / 24);
    return days + "d ago";
  }

  async function signedUrl(path) {
    if (!path) return "";
    var { data } = await window.sb.storage.from("media").createSignedUrl(path, 3600);
    return data ? data.signedUrl : "";
  }

  // mealPrepOnly=true -> the top strip's source; false -> everything else,
  // which is the vertical reel. Only video/photo posts are reel material —
  // uploaded songs (kind "audio") don't belong in a visual scroll feed.
  // DIAGNOSTIC: surfaced in the empty-state messages below so a failed
  // query doesn't silently look identical to "genuinely no posts yet."
  var lastFetchError = null;

  async function fetchBatch(mealPrepOnly, limit, fromOffset, filterType) {
    var query = window.sb
      .from("media")
      .select("id, user_id, kind, storage_path, poster_path, caption, workout_type, location, signature, created_at, profiles!media_user_id_fkey(display_name)")
      .eq("status", "approved")
      .in("kind", ["video", "photo"]);
    // NOTE: plain .neq("workout_type", "Meal Prep") silently drops every row
    // where workout_type is NULL (Postgres: NULL <> 'x' is NULL, not true —
    // so those rows fail BOTH this filter and the .eq() one above, vanishing
    // from both the strip and the reel). Most of the existing approved posts
    // predate this field, so they're NULL — treat NULL as "not Meal Prep"
    // and route it into the general reel instead of dropping it.
    if (mealPrepOnly) {
      query = query.eq("workout_type", "Meal Prep");
    } else if (filterType && filterType !== "All") {
      query = query.eq("workout_type", filterType);
    } else {
      query = query.or("workout_type.neq.Meal Prep,workout_type.is.null");
    }
    var { data, error } = await query.order("created_at", { ascending: false }).range(fromOffset, fromOffset + limit - 1);
    if (error) {
      lastFetchError = error;
      console.error("fetchBatch error (mealPrepOnly=" + mealPrepOnly + "):", error);
      return [];
    }
    if (!data) return [];
    return filterOutBlocked(data);
  }

  // Same filtering rules as fetchBatch's general-reel branch, but for the
  // live-update check: only rows strictly newer than what's already on
  // screen, instead of a page by offset.
  async function fetchNewMediaSince(sinceIso, filterType) {
    var query = window.sb
      .from("media")
      .select("id, user_id, kind, storage_path, poster_path, caption, workout_type, location, signature, created_at, profiles!media_user_id_fkey(display_name)")
      .eq("status", "approved")
      .in("kind", ["video", "photo"]);
    if (filterType && filterType !== "All") {
      query = query.eq("workout_type", filterType);
    } else {
      query = query.or("workout_type.neq.Meal Prep,workout_type.is.null");
    }
    var { data, error } = await query.gt("created_at", sinceIso).order("created_at", { ascending: true }).limit(10);
    if (error) return [];
    return filterOutBlocked(data || []);
  }

  // ---------------- Journeys (community_questions) ----------------
  // Same public "Share Your Journey" stories as ensemblefitness.com's
  // Fitness Journeys page - text posts, no photo/video, no admin queue
  // (members' stories publish instantly, see sql/schema.sql). Fetched with
  // the same shape (rows -> normalized items) as media posts so they can
  // merge into the same reel and sort together by created_at.
  async function fetchJournalBatch(limit, fromOffset) {
    var { data, error } = await window.sb
      .from("community_questions")
      .select("id, user_id, asker_name, question_text, created_at")
      .eq("status", "approved")
      .order("created_at", { ascending: false })
      .range(fromOffset, fromOffset + limit - 1);
    if (error) {
      console.warn("[feed] journeys query failed:", error);
      return [];
    }
    return (data || []).map(journalRowToItem);
  }

  // Only journeys newer than `sinceIso` - used for the live "it just
  // showed up" check rather than re-paging from the top.
  async function fetchNewJournalsSince(sinceIso) {
    var { data, error } = await window.sb
      .from("community_questions")
      .select("id, user_id, asker_name, question_text, created_at")
      .eq("status", "approved")
      .gt("created_at", sinceIso)
      .order("created_at", { ascending: true })
      .limit(10);
    if (error) return [];
    return (data || []).map(journalRowToItem);
  }

  function journalRowToItem(row) {
    return {
      id: row.id,
      user_id: row.user_id || "",
      kind: "journal",
      name: row.asker_name || "A member",
      created_at: row.created_at,
      caption: row.question_text || ""
    };
  }

  async function buildItems(rows) {
    return Promise.all(rows.map(async function (raw) {
      var wantsPoster = raw.kind === "video" && !!raw.poster_path;
      var [url, posterUrl] = await Promise.all([
        signedUrl(raw.storage_path),
        wantsPoster ? signedUrl(raw.poster_path) : Promise.resolve("")
      ]);
      return {
        id: raw.id,
        user_id: raw.user_id,
        kind: raw.kind,
        url: url,
        posterUrl: posterUrl,
        name: (raw.profiles && raw.profiles.display_name) || "A member",
        created_at: raw.created_at,
        workout_type: raw.workout_type || "",
        location: raw.location || "",
        caption: raw.caption || "",
        signature: raw.signature || "",
        storage_path: raw.storage_path || "",
        poster_path: raw.poster_path || ""
      };
    }));
  }

  // ---------------- Meal Prep strip ----------------
  var mealPrepItems = [];
  var currentMealPrepIndex = -1;

  function renderMealPrepStrip() {
    var wrap = document.getElementById("rpMealPrep");
    var track = document.getElementById("rpMealPrepTrack");
    var bannerSub = document.getElementById("rpMealPrepBannerSub");
    if (bannerSub) bannerSub.textContent = mealPrepRealItems.length ? "Community picks" : "Examples";
    if (!mealPrepItems.length) {
      var mpMsg = lastFetchError
        ? "Couldn't load Healthy Meal Prep posts — " + escapeHtml(lastFetchError.message || String(lastFetchError))
        : "No approved Healthy Meal Prep posts yet.";
      wrap.querySelector(".rp-mealprep-banner").insertAdjacentHTML(
        "afterend",
        '<div class="rp-mealprep-empty">' + mpMsg + '</div>'
      );
      track.remove();
      return;
    }
    track.innerHTML = mealPrepItems.map(function (item, i) {
      var initial = (item.name || "?").trim().charAt(0).toUpperCase();
      // A colored initial sits underneath every bubble as a base layer so a
      // slow-loading or missing thumbnail never reads as a blank/broken
      // circle — the img/video fades in on top once it's actually ready.
      var fallback = '<span class="rp-mealprep-fallback" style="background:' + avatarColor(item.user_id) + '">' + escapeHtml(initial) + '</span>';
      var thumb = item.kind === "video"
        ? '<video class="rp-mealprep-media" src="' + item.url + '"' + (item.posterUrl ? ' poster="' + item.posterUrl + '"' : '') + ' muted playsinline preload="metadata" onloadeddata="this.classList.add(\'ready\')"></video><span class="rp-play-badge">▶</span>'
        : '<img class="rp-mealprep-media" src="' + item.url + '" alt="Meal prep" onload="this.classList.add(\'ready\')" onerror="this.style.display=\'none\'" />';
      return '<button type="button" class="rp-mealprep-card" data-index="' + i + '">' +
        '<span class="rp-mealprep-ring"><span class="rp-mealprep-thumb">' + fallback + thumb + '</span></span>' +
        '<span class="rp-mealprep-name">' + escapeHtml(item.name) + '</span>' +
        '</button>';
    }).join("");
    track.querySelectorAll(".rp-mealprep-card").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var idx = Number(btn.dataset.index);
        openMealPrepModal(mealPrepItems[idx], idx);
      });
    });
  }

  // A member's write-up (prep time, ingredients, tips) split into
  // paragraphs on blank lines, so each one can get its own hairline
  // divider — matching the public marketing site's Healthy Meal Prep
  // card exactly instead of one dense wall of pre-wrapped text.
  function splitCaptionParagraphs(caption) {
    return String(caption || "").split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(Boolean);
  }

  // Jumps down to (and, for a real post, focuses) the inline comment
  // section instead of opening a separate popup — the 4th icon in the
  // reaction row (thumbs/muscle/heart/comment) matches the row every
  // other post in the app already shows, but comments stay inline here.
  function focusMealPrepComments() {
    var panel = document.getElementById("rpMpComments");
    if (!panel) return;
    panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
    var input = panel.querySelector(".rp-comment-input");
    if (input) input.focus();
  }

  // Real reactions + comment count for a real member's Meal Prep post —
  // same media_reactions/media_comments tables and toggle logic as
  // renderActions() elsewhere in the app, just re-skinned as light pills
  // (.rp-mp-reaction) instead of the dark scrim-over-video icon buttons
  // used on the reel. Icons are the app's real thumbs-up/muscle/heart
  // vector set (REACTIONS/REACTION_ICONS), plus the same comment icon
  // (COMMENT_ICON) as a 4th pill — Ken's ask: "a thumbs up, a muscle
  // symbol, a heart, and a comment section" all together in that row.
  async function renderMealPrepReactions(item, container) {
    container.innerHTML = REACTIONS.map(function (r) {
      return '<button type="button" class="rp-mp-reaction" data-reaction="' + r.type + '">' +
        '<span class="rp-action-icon">' + reactionIconMarkup(r.type, false) + '</span><span class="rp-action-count"></span></button>';
    }).join("") +
      '<button type="button" class="rp-mp-reaction" data-action="comments">' +
      '<span class="rp-action-icon">' + COMMENT_ICON + '</span><span class="rp-action-count"></span></button>';

    var [{ data: reactions }, { count: commentCount }] = await Promise.all([
      window.sb.from("media_reactions").select("user_id, reaction_type").eq("media_id", item.id),
      window.sb.from("media_comments").select("id", { count: "exact", head: true }).eq("media_id", item.id)
    ]);
    var counts = { thumbs_up: 0, muscle: 0, heart: 0 };
    var mine = {};
    (reactions || []).forEach(function (r) {
      if (counts[r.reaction_type] !== undefined) counts[r.reaction_type]++;
      if (currentUserId && r.user_id === currentUserId) mine[r.reaction_type] = true;
    });
    REACTIONS.forEach(function (r) {
      var btn = container.querySelector('[data-reaction="' + r.type + '"]');
      if (!btn) return;
      btn.classList.toggle("active", !!mine[r.type]);
      setReactionIcon(btn, r.type, !!mine[r.type]);
      btn.querySelector(".rp-action-count").textContent = counts[r.type] || 0;
      btn.addEventListener("click", function () { toggleReaction(item.id, r.type, btn); });
    });
    var commentBtn = container.querySelector('[data-action="comments"]');
    if (commentBtn) {
      commentBtn.querySelector(".rp-action-count").textContent = commentCount || 0;
      commentBtn.addEventListener("click", focusMealPrepComments);
    }
  }

  // Illustrative examples aren't real media rows, so there's no
  // media_reactions/media_comments row to write to — but Ken's ask was
  // for these buttons to actually respond when tapped rather than sit
  // there inert, so each item carries its own small in-memory "mine" map
  // (item._illustrativeMine) that a click toggles right here, entirely
  // client-side. It won't sync to other visitors or survive a refresh —
  // there's genuinely nowhere real to persist it to — but it counts up,
  // highlights, and feels alive instead of dead on click. The moment a
  // real member posts a Meal Prep, mealPrepItems swaps these out for the
  // real thing (renderMealPrepReactions), which already fully persists.
  function toggleIllustrativeReaction(item, type, btn) {
    if (!item._illustrativeMine) item._illustrativeMine = {};
    var nowActive = !item._illustrativeMine[type];
    item._illustrativeMine[type] = nowActive;
    if (!item.illustrativeReactions) item.illustrativeReactions = { thumbs_up: 0, muscle: 0, heart: 0 };
    var current = item.illustrativeReactions[type] || 0;
    item.illustrativeReactions[type] = Math.max(0, current + (nowActive ? 1 : -1));
    btn.classList.toggle("active", nowActive);
    setReactionIcon(btn, type, nowActive);
    var countEl = btn.querySelector(".rp-action-count");
    if (countEl) countEl.textContent = item.illustrativeReactions[type];
  }

  function renderIllustrativeMealPrepReactions(item, container) {
    var counts = item.illustrativeReactions || { thumbs_up: 0, muscle: 0, heart: 0 };
    var mine = item._illustrativeMine || {};
    var commentCount = (item.illustrativeComments || []).length;
    container.innerHTML = REACTIONS.map(function (r) {
      return '<button type="button" class="rp-mp-reaction' + (mine[r.type] ? ' active' : '') + '" data-reaction="' + r.type + '">' +
        '<span class="rp-action-icon">' + reactionIconMarkup(r.type, !!mine[r.type]) + '</span><span class="rp-action-count">' + (counts[r.type] || 0) + '</span></button>';
    }).join("") +
      '<button type="button" class="rp-mp-reaction" data-action="comments">' +
      '<span class="rp-action-icon">' + COMMENT_ICON + '</span><span class="rp-action-count">' + commentCount + '</span></button>';
    REACTIONS.forEach(function (r) {
      var btn = container.querySelector('[data-reaction="' + r.type + '"]');
      if (btn) btn.addEventListener("click", function () { toggleIllustrativeReaction(item, r.type, btn); });
    });
    var commentBtn = container.querySelector('[data-action="comments"]');
    if (commentBtn) commentBtn.addEventListener("click", focusMealPrepComments);
  }

  // Same in-memory approach for comments — typing one and hitting Post
  // appends it to item.illustrativeComments (client-side only, same
  // caveat as the reactions above) and updates the count pill above.
  function renderIllustrativeMealPrepComments(item, container) {
    var listEl = container.querySelector(".rp-comments-list");
    var oldInputRow = container.querySelector(".rp-comment-input-row");
    if (oldInputRow) oldInputRow.remove();
    var oldNote = container.querySelector(".rp-mp-preview-note");
    if (oldNote) oldNote.remove();
    var comments = item.illustrativeComments || [];
    listEl.innerHTML = comments.length
      ? comments.map(function (c) {
          return '<div class="rp-comment-item"><span class="rp-comment-name">' + escapeHtml(c.name) + (c.age ? ", " + escapeHtml(String(c.age)) : "") + '</span>' +
            '<div class="rp-comment-body">' + escapeHtml(c.body) + '</div></div>';
        }).join("")
      : '<div class="rp-comment-empty">Be the first to comment.</div>';

    var inputRow = document.createElement("div");
    inputRow.className = "rp-comment-input-row";
    inputRow.innerHTML =
      '<input type="text" class="rp-comment-input" maxlength="300" placeholder="Add a comment…" />' +
      '<button type="button" class="rp-comment-send">Post</button>';
    container.appendChild(inputRow);
    function postIllustrativeComment() {
      var input = inputRow.querySelector(".rp-comment-input");
      var body = input.value.trim();
      if (!body) return;
      if (!item.illustrativeComments) item.illustrativeComments = [];
      item.illustrativeComments.push({ name: "You", body: body });
      input.value = "";
      renderIllustrativeMealPrepComments(item, container);
      var reactionsWrap = document.getElementById("rpMpReactions");
      if (reactionsWrap) {
        var commentBtn = reactionsWrap.querySelector('[data-action="comments"] .rp-action-count');
        if (commentBtn) commentBtn.textContent = item.illustrativeComments.length;
      }
    }
    inputRow.querySelector(".rp-comment-send").addEventListener("click", postIllustrativeComment);
    inputRow.querySelector(".rp-comment-input").addEventListener("keydown", function (e) {
      if (e.key === "Enter") postIllustrativeComment();
    });

    container.insertAdjacentHTML("beforeend",
      '<div class="rp-mp-preview-note">Example post — reactions and comments here stay on your device; once members start posting their own, this card is replaced by the real thing.</div>');
  }

  // Full profile view, not a story-style photo-with-overlay — a member's
  // whole write-up needs real reading room, real thumbs-up/muscle/heart
  // reactions, and a real inline comment thread, matching the "Healthy
  // Meal Prep Profile" treatment on the public marketing site exactly
  // (Ken's ask, Sept 2026 — "App Ensemble Fitness and Ensemble Fitness
  // should be one and the same... it should be the same layout").
  function openMealPrepModal(item, index) {
    currentMealPrepIndex = (typeof index === "number") ? index : mealPrepItems.indexOf(item);
    var modal = document.getElementById("rpMpModal");
    var media = document.getElementById("rpMpModalMedia");
    var body = document.getElementById("rpMpModalMeta");
    var reactionsWrap = document.getElementById("rpMpReactions");
    var commentsWrap = document.getElementById("rpMpComments");
    var nextBtn = document.getElementById("rpMpNext");
    var scroll = document.getElementById("rpMpModalScroll");

    media.innerHTML = item.kind === "video"
      ? '<video src="' + item.url + '"' + (item.posterUrl ? ' poster="' + item.posterUrl + '"' : '') + ' autoplay loop muted playsinline></video>'
      : '<img src="' + item.url + '" alt="Healthy Meal Prep" />';

    // A leading "Prep time: ..." line (every illustrative example, and
    // any real member who follows the same convention) is shown as the
    // subtitle right under the name instead of as its own bordered
    // paragraph — everything after it gets the divider treatment.
    var paragraphs = splitCaptionParagraphs(item.caption);
    var prepTimeLine = "";
    if (paragraphs.length && /^prep time:/i.test(paragraphs[0])) prepTimeLine = paragraphs.shift();
    var subLine = prepTimeLine || [timeAgo(item.created_at)].concat(item.location ? [item.location] : []).join(" · ");

    body.innerHTML =
      '<div class="rp-mp-eyebrow">🍱 Healthy Meal Prep</div>' +
      '<div class="rp-mp-name">' + escapeHtml(item.name) + (item.age ? ", " + escapeHtml(String(item.age)) : "") + '</div>' +
      (subLine ? '<div class="rp-mp-sub">' + escapeHtml(subLine) + '</div>' : "") +
      paragraphs.map(function (p) { return '<div class="rp-mp-caption-para">' + escapeHtml(p) + '</div>'; }).join("") +
      (item.signature ?
        '<div class="rp-mp-signature">' +
          '<span class="rp-mp-signature-label">Signed,</span>' +
          '<span class="rp-mp-signature-name">' + escapeHtml(item.signature) + '</span>' +
        '</div>'
        : "");

    if (item.illustrativeReactions) {
      renderIllustrativeMealPrepReactions(item, reactionsWrap);
      renderIllustrativeMealPrepComments(item, commentsWrap);
    } else {
      renderMealPrepReactions(item, reactionsWrap);
      var oldNote = commentsWrap.querySelector(".rp-mp-preview-note");
      if (oldNote) oldNote.remove();
      loadComments(item, commentsWrap);
    }

    if (nextBtn) nextBtn.style.display = mealPrepItems.length > 1 ? "flex" : "none";
    if (scroll) scroll.scrollTop = 0;
    modal.hidden = false;
  }

  function closeMealPrepModal() {
    var modal = document.getElementById("rpMpModal");
    modal.querySelectorAll("video").forEach(function (v) { v.pause(); });
    modal.hidden = true;
  }
  document.getElementById("rpMpModalClose").addEventListener("click", closeMealPrepModal);
  // The modal is now a centered card over a dimmed backdrop rather than a
  // full-bleed page, so — like the existing comments popup — a click on
  // the backdrop itself (not the card) closes it. Checking
  // target===currentTarget is what tells the two apart: a click inside
  // the card lands on one of its descendants instead.
  document.getElementById("rpMpModal").addEventListener("click", function (e) {
    if (e.target === e.currentTarget) closeMealPrepModal();
  });

  // "Swipe up for the next meal" — advances through the same strip
  // without closing and reopening the modal, matching the public
  // marketing site's own pagination through its Healthy Meal Prep cards.
  document.getElementById("rpMpNext").addEventListener("click", function () {
    if (!mealPrepItems.length) return;
    var next = (currentMealPrepIndex + 1) % mealPrepItems.length;
    openMealPrepModal(mealPrepItems[next], next);
  });

  // ---------------- Vertical reel ----------------
  var reelObserver = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      var video = entry.target.querySelector("video");
      if (!video) return;
      if (entry.isIntersecting && entry.intersectionRatio > 0.6) {
        var p = video.play();
        if (p && p.catch) p.catch(function () {});
      } else {
        video.pause();
      }
    });
  }, { threshold: [0, 0.6, 1] });

  // A handful of brand-adjacent colors, picked deterministically from the
  // user id so the same member always gets the same avatar color without
  // needing an actual profile photo.
  var AVATAR_COLORS = ["#ff3d68", "#ff9a3d", "#3dd6ff", "#7a3dff", "#3dff9e", "#ffd23d"];
  function avatarColor(userId) {
    var hash = 0;
    for (var i = 0; i < (userId || "").length; i++) hash = (hash * 31 + userId.charCodeAt(i)) >>> 0;
    return AVATAR_COLORS[hash % AVATAR_COLORS.length];
  }

  function buildSlide(item) {
    var el = document.createElement("div");
    el.className = "rp-slide";

    var mediaHtml = item.kind === "video"
      ? '<video src="' + item.url + '"' + (item.posterUrl ? ' poster="' + item.posterUrl + '"' : '') + ' loop muted playsinline preload="metadata"></video>'
      : '<img src="' + item.url + '" alt="Workout post" />';

    var badgeParts = [];
    if (item.workout_type) {
      badgeParts.push('<span class="rp-context-badge rp-badge-type">' +
        (CATEGORY_ICONS[item.workout_type] ? CATEGORY_ICONS[item.workout_type] + " " : "") +
        escapeHtml(item.workout_type) + '</span>');
    }
    if (item.location) {
      badgeParts.push('<span class="rp-context-badge">📍 ' + escapeHtml(item.location) + '</span>');
    }

    var isOwnPost = !!currentUserId && item.user_id === currentUserId;
    var isFollowing = followingIds.has(item.user_id);
    var initial = (item.name || "?").trim().charAt(0).toUpperCase();

    el.innerHTML =
      '<div class="rp-media">' + mediaHtml + '</div>' +
      (item.kind === "video" ? '<div class="rp-mute-hint">🔇 tap video for sound</div>' : "") +
      '<div class="rp-slide-header">' +
        '<div class="rp-slide-avatar" style="background:' + avatarColor(item.user_id) + '">' + escapeHtml(initial) + '</div>' +
        '<div class="rp-slide-headertext">' +
          '<div class="rp-slide-header-name">' + escapeHtml(item.name) + '</div>' +
          '<div class="rp-slide-header-sub">' + escapeHtml(timeAgo(item.created_at)) + '</div>' +
          (badgeParts.length ? '<div class="rp-context-badges">' + badgeParts.join("") + '</div>' : "") +
        '</div>' +
        (isOwnPost ? "" :
          '<button type="button" class="rp-follow-btn' + (isFollowing ? " following" : "") + '" data-action="follow">' +
            (isFollowing ? "Following" : "Follow") +
          '</button>'
        ) +
        '<div class="rp-more-wrap">' +
          '<button type="button" class="rp-more-btn" data-action="more">•••</button>' +
          '<div class="rp-more-menu" id="rpMore-' + item.id + '">' +
            (isOwnPost ?
              '<button type="button" data-action="edit-post">✏️ Edit category &amp; location</button>' +
              '<button type="button" class="danger" data-action="delete-post">🗑️ Delete post</button>'
              :
              '<button type="button" data-action="message">Message ' + escapeHtml(item.name) + '</button>' +
              '<button type="button" data-action="report">Report post</button>' +
              '<button type="button" class="danger" data-action="block">' + (isBlocked(item.user_id) ? "Unblock" : "Block") + " " + escapeHtml(item.name) + '</button>'
            ) +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="rp-overlay-bottom">' +
        (item.caption ? '<div class="rp-caption">' + escapeHtml(item.caption) + '</div>' : "") +
      '</div>' +
      '<div class="rp-actions" id="rpActions-' + item.id + '"></div>';

    if (item.kind === "video") {
      var videoEl = el.querySelector("video");
      var muteHint = el.querySelector(".rp-mute-hint");
      videoEl.addEventListener("click", function () {
        videoEl.muted = !videoEl.muted;
        if (muteHint) muteHint.style.display = videoEl.muted ? "" : "none";
      });
    }

    wireSlideHeader(item, el);
    renderActions(item, el.querySelector(".rp-actions"));
    return el;
  }

  // A journey has no photo/video and isn't a row in the "media" table, so
  // it skips the follow button and in-app comment panel (those stay wired
  // to media-specific tables) — but it DOES get real reactions (star/
  // heart/thumbs up), backed by the same story_reactions table the
  // marketing site uses, so a member can cheer someone on right here
  // without leaving the app. The 4th icon is a real reply count (from
  // story_replies), it just opens the marketing site to actually reply —
  // same destination as the button below, since that's where journey
  // replies live; see renderStoryReactions/journeyReplyUrl.
  //
  // This is the only journey renderer now — journeys only ever load under
  // the dedicated "Journeys" filter (see loadMoreReel), never mixed into
  // "All", so there's no full-bleed-swipe variant to branch to.
  function buildJournalCard(item) {
    var el = document.createElement("div");
    el.className = "rp-slide rp-slide-compact";
    el.setAttribute("data-real-id", item.id);
    var initial = (item.name || "?").trim().charAt(0).toUpperCase();
    el.innerHTML =
      '<div class="rp-jc-header">' +
        '<div class="rp-jc-avatar" style="background:' + avatarColor(item.user_id || item.id) + '">' + escapeHtml(initial) + '</div>' +
        '<div class="rp-jc-headertext">' +
          '<div class="rp-jc-name">' + escapeHtml(item.name) + '</div>' +
          '<div class="rp-jc-time">' + escapeHtml(timeAgo(item.created_at)) + '</div>' +
        '</div>' +
        '<span class="rp-jc-tag">📓 Journey</span>' +
      '</div>' +
      '<div class="rp-jc-quote">' + escapeHtml(item.caption) + '</div>' +
      '<div class="rp-actions rp-journal-actions"></div>' +
      '<button type="button" class="rp-jc-link" data-action="journey-reply">Read &amp; reply →</button>';
    renderStoryReactions(item, el.querySelector(".rp-journal-actions"));
    var replyBtn = el.querySelector('[data-action="journey-reply"]');
    if (replyBtn) replyBtn.addEventListener("click", function () { openJourneyReplyModal(item); });
    return el;
  }

  function buildAnySlide(item) {
    return item.kind === "journal" ? buildJournalCard(item) : buildSlide(item);
  }

  function wireSlideHeader(item, el) {
    var followBtn = el.querySelector('[data-action="follow"]');
    if (followBtn) {
      followBtn.addEventListener("click", function () { toggleFollow(item.user_id, followBtn); });
    }

    var moreBtn = el.querySelector('[data-action="more"]');
    var moreMenu = el.querySelector('[id="rpMore-' + item.id + '"]');
    if (moreBtn && moreMenu) {
      moreBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var wasOpen = moreMenu.classList.contains("open");
        document.querySelectorAll(".rp-more-menu.open").forEach(function (m) { m.classList.remove("open"); });
        if (!wasOpen) moreMenu.classList.add("open");
      });
    }

    var messageBtn = el.querySelector('[data-action="message"]');
    if (messageBtn) messageBtn.addEventListener("click", function () { openMessageModal(item.user_id, item.name); });

    var reportBtn = el.querySelector('[data-action="report"]');
    if (reportBtn) reportBtn.addEventListener("click", function () {
      openReportModal({ type: "media", id: item.id, label: item.name + "'s post" });
    });

    var blockBtn = el.querySelector('[data-action="block"]');
    if (blockBtn) blockBtn.addEventListener("click", async function () {
      var wasBlocked = isBlocked(item.user_id);
      var result = wasBlocked ? await unblockUser(item.user_id) : await blockUser(item.user_id);
      if (result.error) { alert(result.error); return; }
      if (!wasBlocked) el.remove(); // blocked — their post disappears from the reel immediately
    });

    var editBtn = el.querySelector('[data-action="edit-post"]');
    if (editBtn) editBtn.addEventListener("click", function () { openEditPostModal(item, el); });

    var deletePostBtn = el.querySelector('[data-action="delete-post"]');
    if (deletePostBtn) deletePostBtn.addEventListener("click", async function () {
      if (!confirm("Delete this post? This can't be undone.")) return;
      deletePostBtn.disabled = true;
      var pathsToRemove = [item.storage_path].filter(Boolean);
      if (item.poster_path) pathsToRemove.push(item.poster_path);
      if (pathsToRemove.length) await window.sb.storage.from("media").remove(pathsToRemove);
      await window.sb.from("media").delete().eq("id", item.id);
      loadedItems = loadedItems.filter(function (it) { return it.id !== item.id; });
      el.remove();
    });
  }

  // ---- Edit post (category / location) — lets a member fix or add the
  // workout-type tag on their own posts after the fact, so older untagged
  // posts (and anything mis-tagged) can still land in the right filter. ----
  var EDIT_CATEGORY_OPTIONS = ["Working Out", "Walking", "Hiking", "Biking", "Running", "Swimming", "Meal Prep", "Other"];
  var editPostTarget = null; // { item, slideEl }

  function injectEditPostModal() {
    if (document.getElementById("rpEditPostOverlay")) return;
    var optionsHtml = '<option value="">Choose a category…</option>' +
      EDIT_CATEGORY_OPTIONS.map(function (c) { return '<option value="' + c + '">' + escapeHtml(categoryLabel(c)) + '</option>'; }).join("");
    var wrap = document.createElement("div");
    wrap.innerHTML =
      '<div class="simple-modal-overlay" id="rpEditPostOverlay">' +
        '<div class="simple-modal">' +
          '<button type="button" class="simple-modal-close" id="rpEditPostClose" aria-label="Close">&times;</button>' +
          '<div class="eyebrow">Edit Post</div>' +
          '<h3 style="margin-bottom:10px;">What is this post?</h3>' +
          '<div class="form-msg" id="rpEditPostMsg"></div>' +
          '<label for="rpEditPostCategory">Category</label>' +
          '<select id="rpEditPostCategory">' + optionsHtml + '</select>' +
          '<label for="rpEditPostLocation">Location (optional)</label>' +
          '<input type="text" id="rpEditPostLocation" maxlength="80" placeholder="e.g. Riverside Park" />' +
          '<button type="button" class="btn btn-primary btn-block" id="rpEditPostSaveBtn" style="margin-top:12px;">Save</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(wrap.firstChild);

    document.getElementById("rpEditPostClose").addEventListener("click", closeEditPostModal);
    document.getElementById("rpEditPostOverlay").addEventListener("click", function (e) {
      if (e.target.id === "rpEditPostOverlay") closeEditPostModal();
    });
    document.getElementById("rpEditPostSaveBtn").addEventListener("click", saveEditPost);
  }

  function openEditPostModal(item, slideEl) {
    injectEditPostModal();
    editPostTarget = { item: item, slideEl: slideEl };
    document.getElementById("rpEditPostCategory").value = item.workout_type || "";
    document.getElementById("rpEditPostLocation").value = item.location || "";
    var msg = document.getElementById("rpEditPostMsg");
    msg.className = "form-msg";
    document.getElementById("rpEditPostOverlay").classList.add("show");
    document.body.style.overflow = "hidden";
  }

  function closeEditPostModal() {
    var overlay = document.getElementById("rpEditPostOverlay");
    if (overlay) overlay.classList.remove("show");
    document.body.style.overflow = "";
  }

  async function saveEditPost() {
    if (!editPostTarget) return;
    var msg = document.getElementById("rpEditPostMsg");
    var category = document.getElementById("rpEditPostCategory").value;
    var location = document.getElementById("rpEditPostLocation").value.trim();

    if (!category) {
      msg.textContent = "Please choose a category so this post shows up in the right filter.";
      msg.className = "form-msg show error";
      return;
    }

    var btn = document.getElementById("rpEditPostSaveBtn");
    btn.disabled = true;
    btn.textContent = "Saving…";

    var item = editPostTarget.item;
    var { error } = await window.sb.from("media")
      .update({ workout_type: category, location: location || null })
      .eq("id", item.id);

    btn.disabled = false;
    btn.textContent = "Save";

    if (error) {
      msg.textContent = error.message || "Couldn't save — please try again.";
      msg.className = "form-msg show error";
      return;
    }

    item.workout_type = category;
    item.location = location;

    var newEl = buildSlide(item);
    editPostTarget.slideEl.replaceWith(newEl);
    reelObserver.observe(newEl);
    editPostTarget.slideEl = newEl;

    closeEditPostModal();
  }

  document.addEventListener("click", function () {
    document.querySelectorAll(".rp-more-menu.open").forEach(function (m) { m.classList.remove("open"); });
  });

  async function toggleFollow(userId, btn) {
    btn.disabled = true;
    if (followingIds.has(userId)) {
      var { error } = await window.sb.from("follows").delete().eq("follower_id", currentUserId).eq("followee_id", userId);
      if (!error) followingIds.delete(userId);
    } else {
      var { error } = await window.sb.from("follows").insert({ follower_id: currentUserId, followee_id: userId });
      if (!error) followingIds.add(userId);
    }
    btn.disabled = false;
    var nowFollowing = followingIds.has(userId);
    btn.textContent = nowFollowing ? "Following" : "Follow";
    btn.classList.toggle("following", nowFollowing);
  }

  async function renderActions(item, container) {
    container.innerHTML = REACTIONS.map(function (r) {
      return '<button type="button" class="rp-action-btn" data-reaction="' + r.type + '">' +
        '<span class="rp-action-icon">' + reactionIconMarkup(r.type, false) + '</span><span class="rp-action-count"></span></button>';
    }).join("") +
      '<button type="button" class="rp-action-btn rp-comment-btn" data-action="comments">' +
      '<span class="rp-action-icon">' + COMMENT_ICON + '</span><span class="rp-action-count"></span></button>';

    var commentBtn = container.querySelector(".rp-comment-btn");
    commentBtn.addEventListener("click", function () { openCommentsModal(item); });

    var [{ data: reactions }, { count: commentCount }] = await Promise.all([
      window.sb.from("media_reactions").select("user_id, reaction_type").eq("media_id", item.id),
      window.sb.from("media_comments").select("id", { count: "exact", head: true }).eq("media_id", item.id)
    ]);

    var counts = { thumbs_up: 0, muscle: 0, heart: 0 };
    var mine = {};
    (reactions || []).forEach(function (r) {
      if (counts[r.reaction_type] !== undefined) counts[r.reaction_type]++;
      if (currentUserId && r.user_id === currentUserId) mine[r.reaction_type] = true;
    });

    REACTIONS.forEach(function (r) {
      var btn = container.querySelector('[data-reaction="' + r.type + '"]');
      if (!btn) return;
      btn.classList.toggle("active", !!mine[r.type]);
      setReactionIcon(btn, r.type, !!mine[r.type]);
      btn.querySelector(".rp-action-count").textContent = counts[r.type] || "";
      btn.addEventListener("click", function () { toggleReaction(item.id, r.type, btn); });
    });

    commentBtn.querySelector(".rp-action-count").textContent = commentCount || "";
  }

  async function toggleReaction(mediaId, type, btn) {
    if (!currentUserId) return;
    var isActive = btn.classList.contains("active");
    var countEl = btn.querySelector(".rp-action-count");
    var current = parseInt(countEl.textContent || "0", 10) || 0;
    if (isActive) {
      btn.classList.remove("active");
      setReactionIcon(btn, type, false);
      countEl.textContent = (current - 1) > 0 ? current - 1 : "";
      await window.sb.from("media_reactions").delete()
        .eq("media_id", mediaId).eq("user_id", currentUserId).eq("reaction_type", type);
    } else {
      btn.classList.add("active");
      setReactionIcon(btn, type, true);
      countEl.textContent = current + 1;
      await window.sb.from("media_reactions").insert({ media_id: mediaId, user_id: currentUserId, reaction_type: type });
    }
  }

  // Journey replies used to send members out to the marketing site's
  // Fitness Journeys page (the same story_replies rows, just viewed and
  // written there instead of here) — but Ken reported that navigating out
  // like this was logging members out of the app. Replies now open in an
  // in-app modal instead (see openJourneyReplyModal below), reusing the
  // same shared comments-modal shell as media posts, so nobody ever
  // leaves the app to reply to a journey.
  async function renderStoryReactions(item, container) {
    if (!container) return;
    container.innerHTML = STORY_REACTIONS.map(function (r) {
      return '<button type="button" class="rp-action-btn" data-reaction="' + r.type + '">' +
        '<span class="rp-action-icon">' + reactionIconMarkup(r.type, false) + '</span><span class="rp-action-count"></span></button>';
    }).join("") +
      '<button type="button" class="rp-action-btn rp-comment-btn" data-action="comments">' +
      '<span class="rp-action-icon">' + COMMENT_ICON + '</span><span class="rp-action-count"></span></button>';

    var commentBtn = container.querySelector(".rp-comment-btn");
    commentBtn.addEventListener("click", function () { openJourneyReplyModal(item); });

    var [{ data: reactions }, { count: replyCount }] = await Promise.all([
      window.sb.from("story_reactions").select("user_id, reaction").eq("question_id", item.id),
      window.sb.from("story_replies").select("id", { count: "exact", head: true }).eq("question_id", item.id)
    ]);
    container.querySelector(".rp-comment-btn .rp-action-count").textContent = replyCount || "";

    var counts = { clap: 0, heart: 0, thumbs_up: 0 };
    var mine = {};
    (reactions || []).forEach(function (r) {
      if (counts[r.reaction] !== undefined) counts[r.reaction]++;
      if (currentUserId && r.user_id === currentUserId) mine[r.reaction] = true;
    });

    STORY_REACTIONS.forEach(function (r) {
      var btn = container.querySelector('[data-reaction="' + r.type + '"]');
      if (!btn) return;
      btn.classList.toggle("active", !!mine[r.type]);
      setReactionIcon(btn, r.type, !!mine[r.type]);
      btn.querySelector(".rp-action-count").textContent = counts[r.type] || "";
      btn.addEventListener("click", function () { toggleStoryReaction(item.id, r.type, btn); });
    });
  }

  async function toggleStoryReaction(questionId, type, btn) {
    if (!currentUserId) return;
    var isActive = btn.classList.contains("active");
    var countEl = btn.querySelector(".rp-action-count");
    var current = parseInt(countEl.textContent || "0", 10) || 0;
    if (isActive) {
      btn.classList.remove("active");
      setReactionIcon(btn, type, false);
      countEl.textContent = (current - 1) > 0 ? current - 1 : "";
      await window.sb.from("story_reactions").delete()
        .eq("question_id", questionId).eq("user_id", currentUserId).eq("reaction", type);
    } else {
      btn.classList.add("active");
      setReactionIcon(btn, type, true);
      countEl.textContent = current + 1;
      await window.sb.from("story_reactions").insert({ question_id: questionId, user_id: currentUserId, reaction: type });
    }
  }

  // Comments open in one shared modal (fixed over the whole page) instead
  // of expanding inline inside the card that was clicked. The old inline
  // panel grew the card by however many comments it had — 20 comments
  // meant a card 20-comments-tall, throwing off its neighbor in the
  // 2-column grid — which is exactly what Ken flagged after comparing to
  // Instagram's own comments modal, where the underlying feed never
  // moves. This one modal is reused for whichever post was tapped; only
  // its content changes.
  function openCommentsModal(item) {
    var modal = document.getElementById("rpCommentsModal");
    var headerText = document.getElementById("rpCommentsHeaderText");
    var mediaEl = document.getElementById("rpCommentsModalMedia");
    var box = modal.querySelector(".rp-comments-modal-box");
    var panel = modal.querySelector(".rp-comments-modal-panel");

    box.classList.remove("rp-no-media"); // in case the last thing shown here was a journey reply
    headerText.textContent = (item.name || "A member") + "'s post";
    // The media pane is desktop-only (see CSS) — built either way since
    // it's cheap and the signed URL is already sitting on `item`.
    mediaEl.innerHTML = item.kind === "video"
      ? '<video src="' + item.url + '" controls loop muted playsinline></video>'
      : '<img src="' + item.url + '" alt="" />';

    modal.hidden = false;
    loadComments(item, panel);
  }

  function closeCommentsModal() {
    document.getElementById("rpCommentsModal").hidden = true;
  }

  document.getElementById("rpCommentsClose").addEventListener("click", closeCommentsModal);
  document.getElementById("rpCommentsBackdrop").addEventListener("click", closeCommentsModal);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !document.getElementById("rpCommentsModal").hidden) closeCommentsModal();
  });

  async function loadComments(item, panel) {
    var listEl = panel.querySelector(".rp-comments-list");
    listEl.innerHTML = "Loading…";
    // Reopening for a different post while an input row from the last one
    // is still attached would otherwise stack a second input row below it.
    var oldInputRow = panel.querySelector(".rp-comment-input-row");
    if (oldInputRow) oldInputRow.remove();

    var { data: comments } = await window.sb
      .from("media_comments")
      .select("id, user_id, body, created_at, profiles(display_name)")
      .eq("media_id", item.id)
      .order("created_at", { ascending: true });
    var visible = filterOutBlocked(comments || []);

    var listHtml = visible.length
      ? visible.map(function (c) {
          var name = (c.profiles && c.profiles.display_name) || "A member";
          return '<div class="rp-comment-item"><span class="rp-comment-name">' + escapeHtml(name) + '</span>' +
            '<span class="rp-comment-time">' + timeAgo(c.created_at) + '</span>' +
            '<div class="rp-comment-body">' + escapeHtml(c.body) + '</div></div>';
        }).join("")
      : '<div class="rp-comment-empty">Be the first to comment.</div>';

    var listEl = panel.querySelector(".rp-comments-list");
    listEl.innerHTML = listHtml;

    if (currentUserId) {
      var inputRow = document.createElement("div");
      inputRow.className = "rp-comment-input-row";
      inputRow.innerHTML =
        '<input type="text" class="rp-comment-input" maxlength="300" placeholder="Add a comment…" />' +
        '<button type="button" class="rp-comment-send">Post</button>';
      panel.appendChild(inputRow);
      inputRow.querySelector(".rp-comment-send").addEventListener("click", function () { postComment(item, panel); });
      inputRow.querySelector(".rp-comment-input").addEventListener("keydown", function (e) {
        if (e.key === "Enter") postComment(item, panel);
      });
    }
  }

  async function postComment(item, panel) {
    var input = panel.querySelector(".rp-comment-input");
    var body = input.value.trim();
    if (!body) return;
    input.value = "";
    await window.sb.from("media_comments").insert({ media_id: item.id, user_id: currentUserId, body: body });
    loadComments(item, panel);
    var countEl = document.querySelector("#rpActions-" + item.id + " .rp-comment-btn .rp-action-count");
    if (countEl) countEl.textContent = (parseInt(countEl.textContent || "0", 10) || 0) + 1;
  }

  // In-app replacement for the old "Read & reply on Fitness Journeys →"
  // link and comment icon (both used to open journeyReplyUrl(item) in a
  // new tab). Reuses the same #rpCommentsModal shell as media comments,
  // just with the media pane hidden (journeys have no photo/video) and
  // wired to story_replies/story_reactions instead of media_comments.
  function openJourneyReplyModal(item) {
    var modal = document.getElementById("rpCommentsModal");
    var headerText = document.getElementById("rpCommentsHeaderText");
    var mediaEl = document.getElementById("rpCommentsModalMedia");
    var box = modal.querySelector(".rp-comments-modal-box");
    var panel = modal.querySelector(".rp-comments-modal-panel");

    box.classList.add("rp-no-media");
    mediaEl.innerHTML = "";
    headerText.textContent = (item.name || "A member") + "'s journey";

    modal.hidden = false;
    loadJourneyReplies(item, panel);
  }

  async function loadJourneyReplies(item, panel) {
    var listEl = panel.querySelector(".rp-comments-list");
    listEl.innerHTML = "Loading…";
    var oldInputRow = panel.querySelector(".rp-comment-input-row");
    if (oldInputRow) oldInputRow.remove();

    var { data: replies } = await window.sb
      .from("story_replies")
      .select("id, user_id, reply_text, created_at, profiles(display_name)")
      .eq("question_id", item.id)
      .order("created_at", { ascending: true });
    var visible = filterOutBlocked(replies || []);

    var listHtml = visible.length
      ? visible.map(function (c) {
          var name = (c.profiles && c.profiles.display_name) || "A member";
          return '<div class="rp-comment-item"><span class="rp-comment-name">' + escapeHtml(name) + '</span>' +
            '<span class="rp-comment-time">' + timeAgo(c.created_at) + '</span>' +
            '<div class="rp-comment-body">' + escapeHtml(c.reply_text) + '</div></div>';
        }).join("")
      : '<div class="rp-comment-empty">Be the first to reply.</div>';

    listEl = panel.querySelector(".rp-comments-list");
    listEl.innerHTML = listHtml;

    if (currentUserId) {
      var inputRow = document.createElement("div");
      inputRow.className = "rp-comment-input-row";
      inputRow.innerHTML =
        '<input type="text" class="rp-comment-input" maxlength="500" placeholder="Add a reply…" />' +
        '<button type="button" class="rp-comment-send">Post</button>';
      panel.appendChild(inputRow);
      inputRow.querySelector(".rp-comment-send").addEventListener("click", function () { postJourneyReply(item, panel); });
      inputRow.querySelector(".rp-comment-input").addEventListener("keydown", function (e) {
        if (e.key === "Enter") postJourneyReply(item, panel);
      });
    }
  }

  async function postJourneyReply(item, panel) {
    var input = panel.querySelector(".rp-comment-input");
    var body = input.value.trim();
    if (!body) return;
    input.value = "";
    await window.sb.from("story_replies").insert({ question_id: item.id, user_id: currentUserId, reply_text: body });
    loadJourneyReplies(item, panel);
    var countEl = document.querySelector('[data-real-id="' + item.id + '"] .rp-comment-btn .rp-action-count');
    if (countEl) countEl.textContent = (parseInt(countEl.textContent || "0", 10) || 0) + 1;
  }

  // On the phone-frame layout, #rpReel is its own internal scroll
  // container, so the sentinel's visibility has to be measured against it.
  // On the desktop layout, .rp-reel is a normal block in a page that
  // scrolls itself, so the root has to be the viewport (null) instead —
  // scoping it to #rpReel there would never fire since that element no
  // longer scrolls.
  var loadMoreObserver = new IntersectionObserver(function (entries) {
    if (entries[0].isIntersecting) loadMoreReel();
  }, { root: isWideLayout ? null : document.getElementById("rpReel"), threshold: 0.05 });

  function isReelExhausted() {
    if (activeFilter === "Journeys") return journalReachedEnd;
    return reachedEnd;
  }

  function showEmptyReelMessage(msg) {
    document.getElementById("rpReel").insertAdjacentHTML(
      "afterbegin",
      '<div class="rp-empty-reel">' + msg + '</div>'
    );
  }

  // Appends one item to the bottom of the reel (used for normal
  // page-by-page loading, at the sentinel).
  function appendItem(item) {
    var reel = document.getElementById("rpReel");
    var sentinel = document.getElementById("rpSentinel");
    loadedItems.push(item);
    var slideEl = buildAnySlide(item);
    reel.insertBefore(slideEl, sentinel);
    reelObserver.observe(slideEl);
  }

  function trackNewest(items) {
    items.forEach(function (item) {
      if (!newestSeenAt || new Date(item.created_at) > new Date(newestSeenAt)) {
        newestSeenAt = item.created_at;
      }
    });
  }

  async function loadMoreReel() {
    if (loadingMore || isReelExhausted()) return;
    loadingMore = true;

    if (activeFilter === "Journeys") {
      var journalItems = await fetchJournalBatch(JOURNAL_PAGE_SIZE, journalOffset);
      journalOffset += journalItems.length;
      journalReachedEnd = journalItems.length < JOURNAL_PAGE_SIZE;
      loadingMore = false;
      if (!journalItems.length) {
        if (loadedItems.length === 0) showEmptyReelMessage("No approved journeys yet — the first one shared will show up here live.");
        return;
      }
      journalItems.forEach(appendItem);
      trackNewest(journalItems);
      return;
    }

    // "All" (and every specific workout-type filter) is media-only.
    // Journeys are their own dedicated tab now — see the branch above —
    // so a text journey never shows up mixed in among photos/videos here.
    var mediaRows = reachedEnd ? [] : await fetchBatch(false, PAGE_SIZE, offset, activeFilter);
    var combined = await buildItems(mediaRows);
    if (!reachedEnd) {
      offset += mediaRows.length;
      reachedEnd = mediaRows.length < PAGE_SIZE;
    }

    loadingMore = false;

    if (!combined.length) {
      if (loadedItems.length === 0) {
        var reelMsg = lastFetchError
          ? "Couldn't load the feed — " + escapeHtml(lastFetchError.message || String(lastFetchError))
          : (activeFilter !== "All"
              ? "No approved " + escapeHtml(categoryLabel(activeFilter)) + " posts yet."
              : "Nothing approved yet outside Healthy Meal Prep — once videos or photos are shared, they'll scroll here.");
        showEmptyReelMessage(reelMsg);
      }
      return;
    }
    combined.forEach(appendItem);
    trackNewest(combined);
  }

  // Newest real Meal Prep post(s) - checked alongside the main reel on
  // every "media" table change so the top strip pops in a new photo/video
  // live too, exactly like the reel below it.
  async function fetchNewMealPrepPosts() {
    var query = window.sb
      .from("media")
      .select("id, user_id, kind, storage_path, poster_path, caption, workout_type, location, signature, created_at, profiles!media_user_id_fkey(display_name)")
      .eq("status", "approved")
      .in("kind", ["video", "photo"])
      .eq("workout_type", "Meal Prep")
      .order("created_at", { ascending: false })
      .limit(10);
    if (newestMealPrepSeenAt) query = query.gt("created_at", newestMealPrepSeenAt);
    var { data, error } = await query;
    if (error) return [];
    return filterOutBlocked(data || []);
  }

  async function checkForNewMealPrep() {
    var rows = await fetchNewMealPrepPosts();
    if (!rows.length) return;
    var items = await buildItems(rows);
    mealPrepRealItems = items.concat(mealPrepRealItems).slice(0, MEAL_PREP_STRIP_SIZE);
    newestMealPrepSeenAt = items[0].created_at;
    mealPrepItems = composeMealPrepStrip(mealPrepRealItems);
    renderMealPrepStrip();
  }

  // ---------------- Live updates ----------------
  // Ken: "if someone loads something new, you actually see it... it has to
  // constantly keep refreshing across meal prep, workout, walking, hiking,
  // new videos, journeys — all new sections" — the same Instagram/TikTok
  // idea already shipped for the Fitness Journeys badge on the marketing
  // site, extended to the feed itself. Subscribes to both tables a post can
  // come from (media, community_questions); either firing triggers one
  // check for anything genuinely newer than what's already on screen.
  //
  // Requires Realtime turned on for BOTH tables in the Supabase dashboard
  // (Database → Replication) — community_questions already is, from the
  // badge work; "media" needs the same switch flipped, or new posts will
  // still show correctly on the next page load/refresh, just not live.
  var liveUpdateInFlight = false;

  async function checkForLiveUpdates() {
    if (!newestSeenAt || liveUpdateInFlight) return;
    liveUpdateInFlight = true;
    try {
      var wantsMedia = activeFilter !== "Journeys";
      var wantsJournals = activeFilter === "Journeys";
      var mediaRows = wantsMedia ? await fetchNewMediaSince(newestSeenAt, activeFilter) : [];
      var newJournalItems = wantsJournals ? await fetchNewJournalsSince(newestSeenAt) : [];
      var newMediaItems = await buildItems(mediaRows);
      var freshItems = newMediaItems.concat(newJournalItems).sort(function (a, b) {
        return new Date(a.created_at) - new Date(b.created_at); // oldest first, so inserting one-by-one at the top lands newest on top
      });
      if (!freshItems.length) return;

      var reel = document.getElementById("rpReel");
      var emptyMsg = reel.querySelector(".rp-empty-reel");
      if (emptyMsg) emptyMsg.remove();

      // This reel shows one full-height slide at a time (scroll-snap), so
      // whatever's already on screen stays on screen when something new
      // lands above it - there's no "make room and slide it into view"
      // like a normal scrolling list. The pill (below) is what actually
      // tells the person it happened.
      var insertBeforeEl = reel.querySelector(".rp-slide") || document.getElementById("rpSentinel");
      freshItems.forEach(function (item) {
        loadedItems.unshift(item);
        var slideEl = buildAnySlide(item);
        slideEl.classList.add("rp-slide-new");
        reel.insertBefore(slideEl, insertBeforeEl);
        reelObserver.observe(slideEl);
        insertBeforeEl = slideEl; // next one inserts above this one, keeping newest-first order
      });
      trackNewest(freshItems);
      pendingNewCount += freshItems.length;
      showNewPill();
    } finally {
      liveUpdateInFlight = false;
    }
  }

  var pendingNewCount = 0;
  function showNewPill() {
    var pill = document.getElementById("rpNewPill");
    if (!pill) return;
    pill.textContent = "🔔 " + pendingNewCount + " new";
    pill.hidden = false;
  }
  function wireNewPill() {
    var pill = document.getElementById("rpNewPill");
    if (!pill) return;
    pill.addEventListener("click", function () {
      var reel = document.getElementById("rpReel");
      reel.scrollTo({ top: 0, behavior: "smooth" });
      pendingNewCount = 0;
      pill.hidden = true;
    });
    // Someone scrolling themselves back up to the top counts as "seen" too.
    var reelEl = document.getElementById("rpReel");
    reelEl.addEventListener("scroll", function () {
      if (reelEl.scrollTop < 20 && !pill.hidden) {
        pendingNewCount = 0;
        pill.hidden = true;
      }
    });
  }

  function subscribeToLiveFeed() {
    if (!window.sb || !window.sb.channel) return;
    window.sb
      .channel("feed-live-changes")
      .on("postgres_changes", { event: "*", schema: "public", table: "media" }, function () { checkForLiveUpdates(); checkForNewMealPrep(); })
      .on("postgres_changes", { event: "*", schema: "public", table: "community_questions" }, function () { checkForLiveUpdates(); })
      .subscribe();
  }

  (async function init() {
    var user = await requireAuth();
    if (!user) return;
    currentUserId = user.id;
    setModerationUser(currentUserId);
    setMessageSender(currentUserId);
    await loadBlockedIds();

    var { data: followRows } = await window.sb.from("follows").select("followee_id").eq("follower_id", currentUserId);
    followingIds = new Set((followRows || []).map(function (r) { return r.followee_id; }));

    var mealPrepRows = await fetchBatch(true, MEAL_PREP_STRIP_SIZE, 0);
    mealPrepRealItems = await buildItems(mealPrepRows);
    if (mealPrepRealItems.length) newestMealPrepSeenAt = mealPrepRealItems[0].created_at;
    // On a genuine fetch error, keep the strip empty so renderMealPrepStrip's
    // error message shows — don't paper over a real problem with examples.
    mealPrepItems = lastFetchError ? [] : composeMealPrepStrip(mealPrepRealItems);
    renderMealPrepStrip();

    renderFilters();
    await loadMoreReel();
    loadMoreObserver.observe(document.getElementById("rpSentinel"));
    wireNewPill();
    subscribeToLiveFeed();

    // Desktop-dashboard-only content — skipped entirely on the phone
    // layout so the mobile app makes no extra network calls for panels
    // it never shows.
    if (isWideLayout) {
      var { data: profile } = await window.sb.from("profiles").select("display_name").eq("id", currentUserId).maybeSingle();
      var nameEl = document.getElementById("rpDashName");
      if (nameEl && profile && profile.display_name) nameEl.textContent = ", " + profile.display_name;
      loadFitPlusPanel();
      loadQuotePanel();
      loadGearPanel();
      loadMusicPanel();
      loadBooksPanel();
    }
  })();

  // ---------------- Desktop sidebar panels (Quotes / Music / Books) ------
  // Real content from the same tables their own library pages use — no
  // invented data — just a small preview here with a link through to the
  // full page for each.
  // Fitness+ is the matching/dating feature ("Find Your Person" — matched
  // on ZIP code and wake-up time, per fitness-plus.html) and the one Ken
  // has flagged as the revenue driver, so it leads the sidebar. Real
  // match counts computed the same way fitness-plus.html itself does —
  // no fabricated people or numbers.
  async function loadFitPlusPanel() {
    var panel = document.getElementById("rpFitPlusPanel");
    if (!panel) return;
    var { data: mine } = await window.sb
      .from("profiles")
      .select("zip_code, wake_time_category")
      .eq("id", currentUserId)
      .maybeSingle();
    var myZip = (mine && mine.zip_code) || "";
    var myWake = (mine && mine.wake_time_category) || "";

    var { data: others, error } = await window.sb
      .from("profiles")
      .select("id, zip_code, wake_time_category")
      .neq("id", currentUserId);

    var great = 0, partial = 0;
    (!error && others ? others : []).forEach(function (m) {
      var sameZip = !!myZip && m.zip_code === myZip;
      var sameWake = !!myWake && m.wake_time_category === myWake;
      if (sameZip && sameWake) great++;
      else if (sameZip || sameWake) partial++;
    });

    var headline, sub;
    if (!myZip || !myWake) {
      headline = "Complete your profile to unlock matches";
      sub = "Add your ZIP code and wake-up time on My Profile to see who you match with.";
    } else if (great > 0) {
      headline = great + " great match" + (great === 1 ? "" : "es") + " waiting";
      sub = "Same ZIP code and wake-up time as you.";
    } else if (partial > 0) {
      headline = partial + " potential match" + (partial === 1 ? "" : "es") + " nearby";
      sub = "Shares a ZIP code or wake-up time with you.";
    } else {
      headline = "Find Your Person";
      sub = "Matched on your ZIP code and the time you naturally wake up.";
    }

    panel.innerHTML =
      '<div class="rp-panel-head"><span class="rp-panel-icon">❤️</span><span class="rp-panel-title">Fitness+</span></div>' +
      '<div class="rp-quote-text">' + escapeHtml(headline) + '</div>' +
      '<div class="rp-quote-author">' + escapeHtml(sub) + '</div>' +
      '<a class="rp-panel-link" href="fitness-plus.html">Find Your Person →</a>';
  }

  async function loadQuotePanel() {
    var panel = document.getElementById("rpQuotePanel");
    if (!panel) return;
    var { data, error } = await window.sb
      .from("quotes")
      .select("quote_text, author")
      .eq("is_active", true)
      .order("created_at", { ascending: false })
      .limit(1);
    var q = !error && data && data[0];
    panel.innerHTML =
      '<div class="rp-panel-head"><span class="rp-panel-icon">✨</span><span class="rp-panel-title">Daily Inspiration</span></div>' +
      (q
        ? '<div class="rp-quote-text">“' + escapeHtml(q.quote_text) + '”</div>' +
          (q.author ? '<div class="rp-quote-author">— ' + escapeHtml(q.author) + '</div>' : '')
        : '<div class="rp-panel-empty">New quotes coming soon.</div>') +
      '<a class="rp-panel-link" href="quote-library.html">Browse the Quote Library →</a>';
  }

  // Ken's ask (Sept 2026): members had no way to find the Approved Gear
  // (real Amazon picks) page from inside the app at all — it only lived on
  // the public marketing site. Same pattern as loadBooksPanel below: a
  // small live preview pulled straight from the same approved_gear_items
  // table admin.html's "Approved Gear" tab writes to, with a link through
  // to gear.html — a page inside this same app (added Sept 2026 so members
  // never have to leave the app or land on a new tab to browse picks).
  async function loadGearPanel() {
    var panel = document.getElementById("rpGearPanel");
    if (!panel) return;
    var { data, error } = await window.sb
      .from("approved_gear_items")
      .select("name, price")
      .eq("is_active", true)
      .order("created_at", { ascending: false })
      .limit(3);
    var rows = (!error && data ? data : []).map(function (g) {
      return '<div class="rp-mini-row"><span class="rp-mini-dot">🛒</span><div><div class="rp-mini-title">' +
        escapeHtml(g.name) + '</div>' + (g.price ? '<div class="rp-mini-sub">' + escapeHtml(g.price) + '</div>' : '') + '</div></div>';
    }).join("");
    panel.innerHTML =
      '<div class="rp-panel-head"><span class="rp-panel-icon">🛒</span><span class="rp-panel-title">Approved Marketplace</span></div>' +
      (rows || '<div class="rp-panel-empty">Real Amazon picks Ken actually buys — new ones added often.</div>') +
      '<a class="rp-panel-link" href="gear.html">Browse the picks →</a>';
  }

  // Ken's ask (Sept 2026): this teaser used to sort alphabetically and show
  // 3 — as the library grows toward the hundreds of tracks it's meant to
  // hold, that stops being a useful preview (it'd always show the same
  // early-alphabet tracks) and risks the card feeling like it's trying to
  // list the whole library instead of just teasing it. Sorting by newest
  // and capping at 2 keeps this a stable-sized "what just got added" card no
  // matter how big the library gets — the actual full, scrollable list
  // lives on music-library.html (see loadTracks() there), which has no cap.
  async function loadMusicPanel() {
    var panel = document.getElementById("rpMusicPanel");
    if (!panel) return;
    var { data, error } = await window.sb
      .from("tracks")
      .select("title, artist_name")
      .eq("is_active", true)
      .order("created_at", { ascending: false })
      .limit(2);
    var rows = (!error && data ? data : []).map(function (t) {
      return '<div class="rp-mini-row"><span class="rp-mini-dot">🎵</span><div><div class="rp-mini-title">' +
        escapeHtml(t.title) + '</div><div class="rp-mini-sub">' + escapeHtml(t.artist_name || "") + '</div></div></div>';
    }).join("");
    panel.innerHTML =
      '<div class="rp-panel-head"><span class="rp-panel-icon">🎧</span><span class="rp-panel-title">Music Library</span></div>' +
      (rows || '<div class="rp-panel-empty">Tracks coming soon.</div>') +
      '<a class="rp-panel-link" href="music-library.html">Open Music Library →</a>';
  }

  async function loadBooksPanel() {
    var panel = document.getElementById("rpBooksPanel");
    if (!panel) return;
    var { data, error } = await window.sb
      .from("books")
      .select("title, author_name, cover_storage_path")
      .eq("is_active", true)
      .order("created_at", { ascending: false })
      .limit(3);
    var cards = (!error && data ? data : []).map(function (b) {
      var cover = b.cover_storage_path
        ? window.SUPABASE_URL + "/storage/v1/object/public/book-covers/" + b.cover_storage_path
        : "";
      return '<div class="rp-book-card">' +
        (cover ? '<img src="' + cover + '" alt="" />' : '<div class="rp-book-fallback">📖</div>') +
        '<div class="rp-book-title">' + escapeHtml(b.title) + '</div></div>';
    }).join("");
    panel.innerHTML =
      '<div class="rp-panel-head"><span class="rp-panel-icon">📚</span><span class="rp-panel-title">Motivational Books</span></div>' +
      '<div class="rp-book-row">' + (cards || '<div class="rp-panel-empty">New titles coming soon.</div>') + '</div>' +
      '<a class="rp-panel-link" href="https://ensemblefitness.com/books.html" target="_blank" rel="noopener">Browse all books →</a>';
  }
</script>
