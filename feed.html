<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Community — Ensemble Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css" />
<style>
  /* ============================================================
     The app's real home screen: a horizontal "Meal Prep" strip up
     top (Instagram Stories-style), and a full-screen, one-at-a-time
     vertical video/photo feed underneath (Reels/TikTok-style) for
     everything else. Real data, real reactions/comments. Everything
     that isn't Home/Members/Post/Profile lives one tap away behind
     Profile instead of being surfaced up front — no greeting, no
     tabs, no filter chips, no top nav bar cluttering the first
     screen someone sees when they open the app.
     ============================================================ */
  html, body { height: 100%; background: #000; }
  body { margin: 0; overscroll-behavior: none; }

  /* Centering a fixed-width, fixed-position column with inset:0 + margin:
     auto is a known cross-browser gray area — some engines resolve the
     "auto" width against the full viewport before max-width clamps it,
     which leaves the leftover space on one side instead of split evenly
     (exactly what showed up as the app pinned to the right edge on desktop
     Chrome). left:50% + translateX(-50%) sidesteps that ambiguity entirely
     — it centers based on the box's own final width, always. */
  .rp-shell {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    background: #000;
    font-family: 'Inter', sans-serif;
  }
  /* Fills the rest of a wide desktop window with a dim backdrop instead of
     pure black, so the centered phone-width app reads as intentional
     rather than looking like missing/broken content on either side. */
  body {
    background: #0a0a0c;
  }

  /* Desktop-only dashboard elements — invisible on the phone-frame layout
     by default; the desktop media query further down turns them on. */
  .rp-dash-header { display: none; }
  .rp-side-panels { display: contents; }
  .rp-panel { display: none; }

  /* ---- Meal Prep strip -------------------------------------- */
  .rp-mealprep {
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 0 12px;
    background: #000;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  /* A real banner, not just a caption line above the bubbles — gives the
     Meal Prep section its own identity instead of the bare uppercase
     label Instagram-style Stories rows never bother with. */
  .rp-mealprep-banner {
    margin: 0 14px 10px;
    padding: 10px 14px;
    border-radius: 14px;
    background: linear-gradient(120deg, var(--accent-dark), var(--accent) 55%, var(--accent-2));
    display: flex;
    align-items: center;
    gap: 9px;
    box-shadow: 0 4px 14px rgba(219,31,82,0.35);
  }
  .rp-mealprep-banner-icon { font-size: 18px; line-height: 1; }
  .rp-mealprep-banner-text {
    font-family: 'Poppins', 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 800;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: #fff;
  }
  .rp-mealprep-banner-sub {
    margin-left: auto;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    white-space: nowrap;
  }
  .rp-mealprep-track {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 0 14px 4px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .rp-mealprep-track::-webkit-scrollbar { display: none; }
  /* Circular "story" bubbles, like the row Instagram uses for Stories —
     a common cross-app idiom (TikTok, Snapchat, and most social apps do
     some version of it), not something unique to copy. Ours uses our own
     brand colors for the ring and our own square-crop-then-circle-mask
     treatment rather than duplicating any one app's exact art. */
  .rp-mealprep-card {
    flex: 0 0 auto;
    width: 74px;
    background: none;
    border: none;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .rp-mealprep-ring {
    display: block;
    box-sizing: border-box;
    width: 74px;
    height: 74px;
    border-radius: 50%;
    padding: 3px;
    /* Brand gradient (accent-dark → accent → accent-2) instead of the
       generic orange/pink/purple every Stories-style ring defaults to —
       ties the strip back to Ensemble Fitness's own palette. */
    background: linear-gradient(135deg, var(--accent-dark), var(--accent) 50%, var(--accent-2));
  }
  .rp-mealprep-card {
    animation: rpPopIn 0.35s ease backwards;
  }
  .rp-mealprep-card:nth-child(1) { animation-delay: 0.02s; }
  .rp-mealprep-card:nth-child(2) { animation-delay: 0.06s; }
  .rp-mealprep-card:nth-child(3) { animation-delay: 0.10s; }
  .rp-mealprep-card:nth-child(4) { animation-delay: 0.14s; }
  .rp-mealprep-card:nth-child(5) { animation-delay: 0.18s; }
  .rp-mealprep-card:nth-child(n+6) { animation-delay: 0.20s; }
  @keyframes rpPopIn {
    from { opacity: 0; transform: scale(0.8) translateY(6px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .rp-mealprep-thumb {
    display: block;
    box-sizing: border-box;
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: #111;
    border: 2px solid #000;
  }
  /* Absolute + inset:0 rather than width/height:100% — guarantees the
     photo/video fills exactly the circular mask with no possibility of
     it poking past the edge, regardless of the image's own aspect ratio. */
  .rp-mealprep-thumb img, .rp-mealprep-thumb video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }
  .rp-mealprep-fallback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 24px;
    font-family: 'Poppins', 'Inter', sans-serif;
  }
  .rp-mealprep-media {
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .rp-mealprep-media.ready { opacity: 1; }
  .rp-play-badge {
    position: absolute;
    bottom: 3px;
    right: 3px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 9px;
    width: 16px;
    height: 16px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .rp-mealprep-name {
    font-size: 11px;
    color: var(--muted-invert);
    max-width: 78px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .rp-mealprep-empty {
    padding: 0 14px 6px;
    font-size: 12.5px;
    color: var(--faint-invert);
  }

  /* ---- Category filter chips ------------------------------------
     A slim, optional-to-notice row that lets a member jump straight to
     the type of post they want (Running, Meal Prep-adjacent workouts,
     etc.) instead of only ever scrolling in whatever order posts landed —
     something Instagram's Reels tab never offers. */
  .rp-filters {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 10px 14px;
    background: #000;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .rp-filters::-webkit-scrollbar { display: none; }
  .rp-filter-chip {
    flex: 0 0 auto;
    font-family: 'Poppins', 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: rgba(255,255,255,0.75);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.12s ease;
  }
  .rp-filter-chip.active {
    color: #fff;
    border-color: transparent;
    background: linear-gradient(135deg, var(--accent-dark), var(--accent) 55%, var(--accent-2));
    transform: translateY(-1px);
  }

  /* ---- Vertical reel ------------------------------------------ */
  .rp-reel {
    flex: 1;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
  }
  .rp-reel::-webkit-scrollbar { display: none; }

  .rp-slide {
    position: relative;
    height: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    background: #000;
    overflow: hidden;
  }
  .rp-media { position: absolute; inset: 0; }
  .rp-media img, .rp-media video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    animation: rpMediaFadeIn 0.3s ease;
  }
  @keyframes rpMediaFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .rp-mute-hint {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.5);
    color: #fff;
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 999px;
    pointer-events: none;
    opacity: 0.85;
    z-index: 6;
  }

  /* Per-post header — who posted it, a way to follow them, and a way to
     do everything else (message/report/block) without cluttering the
     video itself. Functionally similar to what every reels-style app
     needs, but built with our own colors, spacing and a "•••" menu
     glyph rather than mirroring any one app's exact icon set. */
  .rp-slide-header {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    left: 14px;
    right: 14px;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .rp-slide-avatar {
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    border: 1.5px solid rgba(255,255,255,0.5);
  }
  .rp-slide-headertext {
    flex: 1 1 auto;
    min-width: 0;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
  .rp-slide-header-name {
    font-family: 'Poppins', 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rp-slide-header-sub {
    font-size: 11px;
    color: rgba(255,255,255,0.8);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* Context badges — workout type / location surfaced as small tappable-
     looking pills rather than plain text glued after a timestamp, so a
     post's context is legible at a glance instead of buried in a caption. */
  .rp-context-badges {
    display: flex;
    gap: 5px;
    margin-top: 3px;
    overflow: hidden;
  }
  .rp-context-badge {
    flex: 0 0 auto;
    font-size: 10.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(255,255,255,0.16);
    backdrop-filter: blur(2px);
    border-radius: 999px;
    padding: 3px 9px;
    white-space: nowrap;
    text-shadow: none;
  }
  .rp-context-badge.rp-badge-type {
    background: linear-gradient(135deg, var(--accent-dark), var(--accent-2));
  }
  .rp-follow-btn {
    flex: 0 0 auto;
    background: var(--accent-2);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .rp-follow-btn.following {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.4);
  }
  .rp-more-wrap { position: relative; flex: 0 0 auto; }
  .rp-more-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(0,0,0,0.4);
    border: none;
    color: #fff;
    font-size: 15px;
    letter-spacing: 1px;
    cursor: pointer;
  }
  .rp-more-menu {
    position: absolute;
    top: 36px;
    right: 0;
    background: var(--navy-900);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow-hard);
    min-width: 190px;
    display: none;
  }
  .rp-more-menu.open { display: block; }
  .rp-more-menu button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: #fff;
    font-size: 13px;
    padding: 11px 14px;
    cursor: pointer;
  }
  .rp-more-menu button:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.07); }
  .rp-more-menu button.danger { color: #ff6b6b; }

  .rp-overlay-bottom {
    position: absolute;
    left: 0;
    right: 76px;
    bottom: 0;
    padding: 60px 16px calc(env(safe-area-inset-bottom, 0px) + 22px);
    background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0));
    color: #fff;
  }
  .rp-name { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
  .rp-sub { font-size: 12px; color: rgba(255,255,255,0.75); margin-bottom: 6px; }
  .rp-caption { font-size: 13.5px; line-height: 1.4; color: rgba(255,255,255,0.95); }

  .rp-actions {
    position: absolute;
    right: 10px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 30px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    z-index: 5;
  }
  .rp-action-btn {
    background: none;
    border: none;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    padding: 0;
  }
  .rp-action-emoji {
    width: 46px;
    height: 46px;
    border-radius: 999px;
    background: rgba(20,22,28,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    backdrop-filter: blur(3px);
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .rp-action-btn.active .rp-action-emoji {
    background: var(--accent-2);
    transform: scale(1.08);
  }
  .rp-action-count {
    font-size: 11.5px;
    font-weight: 700;
    color: rgba(255,255,255,0.9);
    min-height: 14px;
  }

  .rp-comments-panel {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    max-height: 62%;
    background: var(--navy-900);
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
    transform: translateY(105%);
    transition: transform 0.25s ease;
    display: flex;
    flex-direction: column;
    z-index: 10;
    box-shadow: 0 -20px 40px rgba(0,0,0,0.4);
  }
  .rp-comments-panel.open { transform: translateY(0); }
  .rp-comments-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    color: #fff;
    font-weight: 700;
    font-size: 13.5px;
  }
  .rp-comments-close {
    background: none; border: none; color: rgba(255,255,255,0.7); font-size: 15px; cursor: pointer; padding: 4px;
  }
  .rp-comments-list {
    overflow-y: auto;
    padding: 6px 16px;
    flex: 1;
  }
  .rp-comment-item { padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .rp-comment-name { color: #fff; font-weight: 700; font-size: 12.5px; }
  .rp-comment-time { color: var(--faint-invert); font-size: 11px; margin-left: 6px; }
  .rp-comment-body { color: rgba(255,255,255,0.9); font-size: 13px; margin-top: 2px; }
  .rp-comment-empty { color: var(--faint-invert); font-size: 13px; padding: 14px 0; }
  .rp-comment-input-row {
    display: flex;
    gap: 8px;
    padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .rp-comment-input {
    flex: 1;
    background: rgba(255,255,255,0.08);
    border: none;
    border-radius: 999px;
    padding: 9px 14px;
    color: #fff;
    font-size: 13px;
  }
  .rp-comment-input::placeholder { color: var(--faint-invert); }
  .rp-comment-send {
    background: var(--accent-2);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 0 16px;
    font-weight: 700;
    font-size: 12.5px;
    cursor: pointer;
  }

  .rp-empty-reel {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--faint-invert);
    font-size: 13.5px;
    text-align: center;
    padding: 0 30px;
  }

  .rp-sentinel { height: 1px; }

  /* ---- Bottom tab bar -------------------------------------------
     The only persistent chrome besides the Meal Prep strip.
     Everything that isn't Home/Members/Post/Profile (My Journey,
     Fitness+, Music, Quotes, Sign Out, Admin) lives one tap away
     behind Profile instead of being surfaced up front — the "hide
     everything else, Instagram-style" part of this layout. A flex
     sibling of .rp-reel (not an overlay), so the reel's own height
     shrinks to make room for it and nothing inside a slide (actions,
     captions, comments) needs adjusting. */
  .rp-tabbar {
    flex: 0 0 auto;
    display: flex;
    align-items: stretch;
    background: #000;
    border-top: 1px solid rgba(255,255,255,0.08);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .rp-tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 9px 4px 8px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.55);
    text-decoration: none;
    font-family: 'Inter', sans-serif;
  }
  .rp-tab-icon { font-size: 20px; line-height: 1; }
  .rp-tab-label { font-size: 10px; font-weight: 600; letter-spacing: 0.01em; }
  .rp-tab.active { color: #fff; }
  .rp-tab-post .rp-tab-icon {
    width: 30px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 7px;
    border: 1.6px solid currentColor;
    font-size: 15px;
  }

  /* ---- Meal-prep single-item viewer (tap a strip card) --------- */
  .rp-mp-modal {
    position: fixed;
    inset: 0;
    max-width: 480px;
    margin: 0 auto;
    background: #000;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .rp-mp-modal[hidden] { display: none; }
  .rp-mp-modal-media { position: absolute; inset: 0; }
  .rp-mp-modal-media img, .rp-mp-modal-media video { width: 100%; height: 100%; object-fit: cover; }
  .rp-mp-modal-close {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: 14px;
    z-index: 5;
    width: 34px; height: 34px;
    border-radius: 999px;
    background: rgba(0,0,0,0.5);
    color: #fff;
    border: none;
    font-size: 16px;
    cursor: pointer;
  }
  .rp-mp-modal-meta {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
    color: #fff;
    z-index: 5;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }

  /* ==================================================================
     Desktop / wide-window dashboard.
     The phone-frame column above is exactly "the cell phone app" and is
     untouched below this breakpoint. At and above it, signed-in members
     get a real dashboard instead of a squeezed phone view — a bold
     brand-energy header like the marketing homepage's, a fixed left icon
     rail, a wide video/workout grid as the main event, and a sidebar
     stack surfacing the rest of the brand (Meal Prep, Quote Library,
     Music Library, motivational Books) so there's a reason to stay on
     the page beyond one feed. No old nav bar or plain grid comes back —
     this is new, built for a wide screen on purpose.
     ================================================================== */
  @media (min-width: 900px) {
    html, body { background: #0a0a0c; }

    /* Fixed left icon rail — the tab bar, rotated from a mobile bottom
       bar into a vertical left-side icon column. */
    .rp-tabbar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: auto;
      width: 84px;
      height: 100vh;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      gap: 30px;
      padding: 28px 0 0;
      border-top: none;
      border-right: 1px solid rgba(255,255,255,0.08);
      z-index: 30;
    }
    .rp-tab { flex: none; width: auto; padding: 0; }
    .rp-tab-label { display: none; }
    .rp-tab-icon { font-size: 24px; }
    .rp-tab-post .rp-tab-icon { width: 34px; height: 26px; }

    /* The shell becomes a real page grid: a full-width header row, then
       a wide video column beside a narrower sidebar stack. */
    .rp-shell {
      position: static;
      left: auto;
      transform: none;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      grid-template-areas:
        "header header"
        "filters side"
        "reel   side";
      column-gap: 28px;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 32px 60px 116px;
      box-sizing: border-box;
      min-height: auto;
      background: transparent;
    }

    .rp-dash-header { display: block; grid-area: header; margin-bottom: 22px; }
    .rp-dash-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: 'Poppins', 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--accent-2);
      margin-bottom: 6px;
    }
    .rp-dash-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 8px var(--accent-2);
    }
    .rp-dash-title {
      margin: 0;
      font-family: 'Poppins', 'Inter', sans-serif;
      font-size: 30px;
      font-weight: 800;
      color: #fff;
    }
    .rp-dash-title span { color: var(--accent-2); }

    .rp-side-panels {
      display: flex;
      flex-direction: column;
      gap: 20px;
      grid-area: side;
    }
    .rp-mealprep { padding: 0; border-bottom: none; background: transparent; }
    .rp-mealprep-track { padding: 2px 2px 4px; flex-wrap: wrap; gap: 14px; }
    .rp-mealprep-card { width: 82px; }
    .rp-mealprep-ring { width: 82px; height: 82px; }
    .rp-mealprep-name { max-width: 82px; }
    .rp-filters { grid-area: filters; padding: 0 0 18px; border-bottom: none; }

    /* Generic sidebar panel shell — bold bordered card with a warm glow,
       reused for Meal Prep, Quotes, Music, and Books so the whole rail
       reads as one energetic, branded set of tiles. */
    .rp-panel {
      display: block;
      background: linear-gradient(165deg, #170a12, #120a10);
      border: 1px solid rgba(255,61,104,0.22);
      border-radius: 18px;
      padding: 16px 16px 14px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.35);
    }
    /* Fitness+ is the revenue-driving feature — a slightly warmer/bolder
       treatment than the other sidebar panels so it doesn't just blend
       into the rest of the stack. */
    .rp-panel-fitplus {
      background: linear-gradient(165deg, #2a0f10, #170a0c);
      border: 1px solid rgba(255,154,61,0.35);
      box-shadow: 0 10px 26px rgba(255,109,31,0.16);
    }
    .rp-panel-fitplus .rp-panel-link { color: #ff9a3d; }
    .rp-panel-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .rp-panel-icon { font-size: 16px; }
    .rp-panel-title {
      font-family: 'Poppins', 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: #fff;
    }
    .rp-panel-empty { font-size: 12.5px; color: var(--faint-invert); padding: 4px 0 8px; }
    .rp-panel-link {
      display: inline-block;
      margin-top: 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-2);
      text-decoration: none;
    }
    .rp-panel-link:hover { text-decoration: underline; }

    .rp-quote-text {
      font-family: 'Poppins', 'Inter', sans-serif;
      font-size: 14.5px;
      font-weight: 600;
      line-height: 1.4;
      color: #fff;
    }
    .rp-quote-author { margin-top: 6px; font-size: 12px; color: var(--muted-invert); }

    .rp-mini-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
    .rp-mini-row:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.06); }
    .rp-mini-dot { font-size: 15px; flex: 0 0 auto; }
    .rp-mini-title { font-size: 13px; font-weight: 700; color: #fff; }
    .rp-mini-sub { font-size: 11.5px; color: var(--faint-invert); }

    .rp-book-row { display: flex; gap: 10px; }
    .rp-book-card { flex: 1 1 0; min-width: 0; }
    .rp-book-card img, .rp-book-fallback {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border-radius: 8px;
      background: #221319;
    }
    .rp-book-fallback { display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .rp-book-title {
      margin-top: 5px;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--muted-invert);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Main video/workout column — a dense multi-column grid rather than
       one post at a time, so "way more" is visible at once. */
    .rp-reel {
      grid-area: reel;
      flex: none;
      overflow: visible;
      scroll-snap-type: none;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px;
      align-content: start;
    }
    .rp-sentinel { grid-column: 1 / -1; height: 1px; }

    /* Post card: header → media → action icons → caption → comments,
       stacked in normal flow via flex "order" rather than overlaid —
       the DOM order stays exactly what mobile uses, only the visual
       arrangement changes here. */
    .rp-slide {
      display: flex;
      flex-direction: column;
      position: static;
      height: auto;
      scroll-snap-align: none;
      background: #0e0e11;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      overflow: visible;
      transition: border-color 0.15s ease;
    }
    .rp-slide:hover { border-color: rgba(255,61,104,0.4); }
    .rp-media {
      position: static;
      order: 2;
      aspect-ratio: 4 / 5;
      max-height: none;
      border-radius: 0;
      overflow: hidden;
      background: #000;
    }
    .rp-mute-hint { display: none; }
    .rp-slide-header {
      position: static;
      order: 1;
      padding: 12px 14px;
      text-shadow: none;
    }
    .rp-slide-headertext { text-shadow: none; }
    .rp-actions {
      position: static;
      order: 3;
      flex-direction: row;
      align-items: center;
      gap: 16px;
      padding: 10px 14px 2px;
    }
    .rp-overlay-bottom {
      position: static;
      order: 4;
      background: none;
      padding: 4px 14px 14px;
    }
    .rp-comments-panel {
      position: static;
      order: 5;
      display: none;
      transform: none;
      max-height: 300px;
      border-radius: 0 0 16px 16px;
      box-shadow: none;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .rp-comments-panel.open { display: flex; }

    .rp-mp-modal {
      left: 50%;
      right: auto;
      transform: translateX(-50%);
      margin: 0;
    }

    /* Below ~1150px, two video columns get cramped next to a 320px
       sidebar — drop to one column and let the sidebar sit under it. */
    @media (max-width: 1150px) {
      .rp-shell {
        grid-template-columns: 1fr;
        grid-template-areas:
          "header"
          "filters"
          "reel"
          "side";
      }
      .rp-reel { grid-template-columns: repeat(2, 1fr); }
      .rp-side-panels { flex-direction: row; flex-wrap: wrap; }
      .rp-side-panels .rp-mealprep,
      .rp-side-panels .rp-panel { flex: 1 1 260px; }
    }
  }
</style>
</head>
<body>

<div class="rp-shell">
  <!-- Desktop-only — hidden entirely on the phone-frame layout below. A
       bold, brand-energy header like the marketing homepage's hero,
       instead of the plain minimal top of the mobile app. -->
  <div class="rp-dash-header" id="rpDashHeader">
    <span class="rp-dash-eyebrow"><span class="rp-dash-dot"></span>YOUR COMMUNITY</span>
    <h1 class="rp-dash-title">Welcome back<span id="rpDashName"></span></h1>
  </div>

  <!-- display:contents on mobile makes this wrapper invisible to layout —
       .rp-mealprep behaves exactly as it always has there. On desktop it
       becomes a real sidebar stack: Meal Prep + Quotes + Music + Books,
       so signed-in members see more of the brand, not just the reel. -->
  <div class="rp-side-panels" id="rpSidePanels">
    <div class="rp-mealprep" id="rpMealPrep">
      <div class="rp-mealprep-banner">
        <span class="rp-mealprep-banner-icon">🍱</span>
        <span class="rp-mealprep-banner-text">Meal Prep</span>
        <span class="rp-mealprep-banner-sub" id="rpMealPrepBannerSub">Community picks</span>
      </div>
      <div class="rp-mealprep-track" id="rpMealPrepTrack"></div>
    </div>
    <div class="rp-panel rp-panel-fitplus" id="rpFitPlusPanel"></div>
    <div class="rp-panel rp-panel-quote" id="rpQuotePanel"></div>
    <div class="rp-panel rp-panel-music" id="rpMusicPanel"></div>
    <div class="rp-panel rp-panel-books" id="rpBooksPanel"></div>
  </div>

  <div class="rp-filters" id="rpFilters"></div>

  <div class="rp-reel" id="rpReel">
    <div class="rp-sentinel" id="rpSentinel"></div>
  </div>

  <nav class="rp-tabbar" aria-label="Main">
    <a href="feed.html" class="rp-tab active">
      <span class="rp-tab-icon">🏠</span><span class="rp-tab-label">Home</span>
    </a>
    <a href="members.html" class="rp-tab">
      <span class="rp-tab-icon">🔎</span><span class="rp-tab-label">Members</span>
    </a>
    <a href="profile.html#uploadCard" class="rp-tab rp-tab-post">
      <span class="rp-tab-icon">+</span><span class="rp-tab-label">Post</span>
    </a>
    <a href="profile.html" class="rp-tab">
      <span class="rp-tab-icon">👤</span><span class="rp-tab-label">Profile</span>
    </a>
  </nav>
</div>

<div class="rp-mp-modal" id="rpMpModal" hidden>
  <button type="button" class="rp-mp-modal-close" id="rpMpModalClose">✕</button>
  <div class="rp-mp-modal-media" id="rpMpModalMedia"></div>
  <div class="rp-mp-modal-meta" id="rpMpModalMeta"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/shared-session.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/moderation.js"></script>
<script src="js/social.js"></script>
<script>
  // The phone-frame column (mobile / Simulator) is "the cell phone app" and
  // is untouched by any of this — this flag only steers the desktop grid
  // behavior (no autoplay-everything, infinite-scroll watches the whole
  // page instead of a fixed-height inner scroller). Checked once at load;
  // resizing across the breakpoint mid-session isn't handled, which is fine
  // for a page nobody resizes live.
  var isWideLayout = window.matchMedia("(min-width: 900px)").matches;

  var currentUserId = null;
  var PAGE_SIZE = 8;
  var offset = 0;
  var reachedEnd = false;
  var loadingMore = false;
  var loadedItems = [];
  var followingIds = new Set();

  // Category filter chips — lets a member jump straight to a workout type
  // instead of only scrolling in upload order. "Meal Prep" isn't listed
  // here since it already has its own dedicated strip up top.
  var CATEGORY_FILTERS = ["All", "Working Out", "Walking", "Hiking", "Biking", "Running", "Swimming", "Other"];
  var CATEGORY_ICONS = {
    "Working Out": "💪", "Walking": "🚶", "Hiking": "🥾", "Biking": "🚴",
    "Running": "🏃", "Swimming": "🏊", "Meal Prep": "🍱", "Other": "✨"
  };
  var activeFilter = "All";

  // Illustrative placeholders — the same six "not live posts yet" examples
  // already used on the public Healthy Meal Prep page on the marketing
  // site (assets/mealprep/*.jpg), reused here so the strip has real-looking
  // photos to preview/perfect the layout with until members' own posts are
  // tagged "Meal Prep". Swapped out automatically the moment a real one exists.
  var ILLUSTRATIVE_MEAL_PREP = [
    { name: "Marcus", file: "mealprep-marcus.jpg", caption: "Down 15 lbs eating this three or four times a week. Small changes add up." },
    { name: "Denise", file: "mealprep-denise.jpg", caption: "This salad became my go-to lunch. My skin and energy have never been better." },
    { name: "Priya", file: "mealprep-priya.jpg", caption: "Post-workout fuel that actually tastes good — I've had this every morning for six months." },
    { name: "James", file: "mealprep-james.jpg", caption: "Eating right isn't always easy, but swapping breakfast for this made mornings so much simpler." },
    { name: "Tyler", file: "mealprep-tyler.jpg", caption: "Sunday meal prep keeps me on track all week. No excuses, no drive-thru." },
    { name: "Angela", file: "mealprep-angela.jpg", caption: "Started with this smoothie every morning. Three months in, I feel like a different person." }
  ];
  var usingIllustrativeMealPrep = false;

  function renderFilters() {
    var wrap = document.getElementById("rpFilters");
    wrap.innerHTML = CATEGORY_FILTERS.map(function (label) {
      return '<button type="button" class="rp-filter-chip' + (label === activeFilter ? " active" : "") + '" data-filter="' + escapeHtml(label) + '">' +
        (CATEGORY_ICONS[label] ? CATEGORY_ICONS[label] + " " : "") + escapeHtml(label) +
        '</button>';
    }).join("");
    wrap.querySelectorAll(".rp-filter-chip").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var filter = btn.dataset.filter;
        if (filter === activeFilter) return;
        activeFilter = filter;
        renderFilters();
        resetReel();
      });
    });
  }

  function resetReel() {
    var reel = document.getElementById("rpReel");
    var sentinel = document.getElementById("rpSentinel");
    reel.querySelectorAll(".rp-slide, .rp-empty-reel").forEach(function (el) { el.remove(); });
    loadedItems = [];
    offset = 0;
    reachedEnd = false;
    reel.scrollTop = 0;
    if (sentinel) reel.appendChild(sentinel); // keep sentinel last so infinite-scroll still fires
    loadMoreReel();
  }

  var REACTIONS = [
    { type: "thumbs_up", emoji: "👍" },
    { type: "muscle", emoji: "💪" },
    { type: "heart", emoji: "❤️" }
  ];

  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function timeAgo(iso) {
    var diffMs = Math.max(0, Date.now() - new Date(iso).getTime());
    var mins = Math.floor(diffMs / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + "m ago";
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + "h ago";
    var days = Math.floor(hrs / 24);
    return days + "d ago";
  }

  async function signedUrl(path) {
    if (!path) return "";
    var { data } = await window.sb.storage.from("media").createSignedUrl(path, 3600);
    return data ? data.signedUrl : "";
  }

  // mealPrepOnly=true -> the top strip's source; false -> everything else,
  // which is the vertical reel. Only video/photo posts are reel material —
  // uploaded songs (kind "audio") don't belong in a visual scroll feed.
  // DIAGNOSTIC: surfaced in the empty-state messages below so a failed
  // query doesn't silently look identical to "genuinely no posts yet."
  var lastFetchError = null;

  async function fetchBatch(mealPrepOnly, limit, fromOffset, filterType) {
    var query = window.sb
      .from("media")
      .select("id, user_id, kind, storage_path, poster_path, caption, workout_type, location, created_at, profiles!media_user_id_fkey(display_name)")
      .eq("status", "approved")
      .in("kind", ["video", "photo"]);
    // NOTE: plain .neq("workout_type", "Meal Prep") silently drops every row
    // where workout_type is NULL (Postgres: NULL <> 'x' is NULL, not true —
    // so those rows fail BOTH this filter and the .eq() one above, vanishing
    // from both the strip and the reel). Most of the existing approved posts
    // predate this field, so they're NULL — treat NULL as "not Meal Prep"
    // and route it into the general reel instead of dropping it.
    if (mealPrepOnly) {
      query = query.eq("workout_type", "Meal Prep");
    } else if (filterType && filterType !== "All") {
      query = query.eq("workout_type", filterType);
    } else {
      query = query.or("workout_type.neq.Meal Prep,workout_type.is.null");
    }
    var { data, error } = await query.order("created_at", { ascending: false }).range(fromOffset, fromOffset + limit - 1);
    if (error) {
      lastFetchError = error;
      console.error("fetchBatch error (mealPrepOnly=" + mealPrepOnly + "):", error);
      return [];
    }
    if (!data) return [];
    return filterOutBlocked(data);
  }

  async function buildItems(rows) {
    return Promise.all(rows.map(async function (raw) {
      var wantsPoster = raw.kind === "video" && !!raw.poster_path;
      var [url, posterUrl] = await Promise.all([
        signedUrl(raw.storage_path),
        wantsPoster ? signedUrl(raw.poster_path) : Promise.resolve("")
      ]);
      return {
        id: raw.id,
        user_id: raw.user_id,
        kind: raw.kind,
        url: url,
        posterUrl: posterUrl,
        name: (raw.profiles && raw.profiles.display_name) || "A member",
        created_at: raw.created_at,
        workout_type: raw.workout_type || "",
        location: raw.location || "",
        caption: raw.caption || "",
        storage_path: raw.storage_path || "",
        poster_path: raw.poster_path || ""
      };
    }));
  }

  // ---------------- Meal Prep strip ----------------
  var mealPrepItems = [];

  function renderMealPrepStrip() {
    var wrap = document.getElementById("rpMealPrep");
    var track = document.getElementById("rpMealPrepTrack");
    var bannerSub = document.getElementById("rpMealPrepBannerSub");
    if (bannerSub) bannerSub.textContent = usingIllustrativeMealPrep ? "Preview" : "Community picks";
    if (!mealPrepItems.length) {
      var mpMsg = lastFetchError
        ? "Couldn't load Meal Prep posts — " + escapeHtml(lastFetchError.message || String(lastFetchError))
        : "No approved meal prep posts yet.";
      wrap.querySelector(".rp-mealprep-banner").insertAdjacentHTML(
        "afterend",
        '<div class="rp-mealprep-empty">' + mpMsg + '</div>'
      );
      track.remove();
      return;
    }
    track.innerHTML = mealPrepItems.map(function (item, i) {
      var initial = (item.name || "?").trim().charAt(0).toUpperCase();
      // A colored initial sits underneath every bubble as a base layer so a
      // slow-loading or missing thumbnail never reads as a blank/broken
      // circle — the img/video fades in on top once it's actually ready.
      var fallback = '<span class="rp-mealprep-fallback" style="background:' + avatarColor(item.user_id) + '">' + escapeHtml(initial) + '</span>';
      var thumb = item.kind === "video"
        ? '<video class="rp-mealprep-media" src="' + item.url + '"' + (item.posterUrl ? ' poster="' + item.posterUrl + '"' : '') + ' muted playsinline preload="metadata" onloadeddata="this.classList.add(\'ready\')"></video><span class="rp-play-badge">▶</span>'
        : '<img class="rp-mealprep-media" src="' + item.url + '" alt="Meal prep" onload="this.classList.add(\'ready\')" onerror="this.style.display=\'none\'" />';
      return '<button type="button" class="rp-mealprep-card" data-index="' + i + '">' +
        '<span class="rp-mealprep-ring"><span class="rp-mealprep-thumb">' + fallback + thumb + '</span></span>' +
        '<span class="rp-mealprep-name">' + escapeHtml(item.name) + '</span>' +
        '</button>';
    }).join("");
    track.querySelectorAll(".rp-mealprep-card").forEach(function (btn) {
      btn.addEventListener("click", function () {
        openMealPrepModal(mealPrepItems[Number(btn.dataset.index)]);
      });
    });
  }

  function openMealPrepModal(item) {
    var modal = document.getElementById("rpMpModal");
    var media = document.getElementById("rpMpModalMedia");
    var meta = document.getElementById("rpMpModalMeta");
    media.innerHTML = item.kind === "video"
      ? '<video src="' + item.url + '"' + (item.posterUrl ? ' poster="' + item.posterUrl + '"' : '') + ' autoplay loop muted playsinline></video>'
      : '<img src="' + item.url + '" alt="Meal prep" />';
    var sub = [timeAgo(item.created_at)];
    if (item.location) sub.push(item.location);
    meta.innerHTML =
      '<div class="rp-name">' + escapeHtml(item.name) + '</div>' +
      '<div class="rp-sub">' + sub.map(escapeHtml).join(" · ") + '</div>' +
      (item.caption ? '<div class="rp-caption">' + escapeHtml(item.caption) + '</div>' : "");
    modal.hidden = false;
  }

  document.getElementById("rpMpModalClose").addEventListener("click", function () {
    var modal = document.getElementById("rpMpModal");
    modal.querySelectorAll("video").forEach(function (v) { v.pause(); });
    modal.hidden = true;
  });

  // ---------------- Vertical reel ----------------
  var reelObserver = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      var video = entry.target.querySelector("video");
      if (!video) return;
      if (entry.isIntersecting && entry.intersectionRatio > 0.6) {
        var p = video.play();
        if (p && p.catch) p.catch(function () {});
      } else {
        video.pause();
      }
    });
  }, { threshold: [0, 0.6, 1] });

  // A handful of brand-adjacent colors, picked deterministically from the
  // user id so the same member always gets the same avatar color without
  // needing an actual profile photo.
  var AVATAR_COLORS = ["#ff3d68", "#ff9a3d", "#3dd6ff", "#7a3dff", "#3dff9e", "#ffd23d"];
  function avatarColor(userId) {
    var hash = 0;
    for (var i = 0; i < (userId || "").length; i++) hash = (hash * 31 + userId.charCodeAt(i)) >>> 0;
    return AVATAR_COLORS[hash % AVATAR_COLORS.length];
  }

  function buildSlide(item) {
    var el = document.createElement("div");
    el.className = "rp-slide";

    var mediaHtml = item.kind === "video"
      ? '<video src="' + item.url + '"' + (item.posterUrl ? ' poster="' + item.posterUrl + '"' : '') + ' loop muted playsinline preload="metadata"></video>'
      : '<img src="' + item.url + '" alt="Workout post" />';

    var badgeParts = [];
    if (item.workout_type) {
      badgeParts.push('<span class="rp-context-badge rp-badge-type">' +
        (CATEGORY_ICONS[item.workout_type] ? CATEGORY_ICONS[item.workout_type] + " " : "") +
        escapeHtml(item.workout_type) + '</span>');
    }
    if (item.location) {
      badgeParts.push('<span class="rp-context-badge">📍 ' + escapeHtml(item.location) + '</span>');
    }

    var isOwnPost = !!currentUserId && item.user_id === currentUserId;
    var isFollowing = followingIds.has(item.user_id);
    var initial = (item.name || "?").trim().charAt(0).toUpperCase();

    el.innerHTML =
      '<div class="rp-media">' + mediaHtml + '</div>' +
      (item.kind === "video" ? '<div class="rp-mute-hint">🔇 tap video for sound</div>' : "") +
      '<div class="rp-slide-header">' +
        '<div class="rp-slide-avatar" style="background:' + avatarColor(item.user_id) + '">' + escapeHtml(initial) + '</div>' +
        '<div class="rp-slide-headertext">' +
          '<div class="rp-slide-header-name">' + escapeHtml(item.name) + '</div>' +
          '<div class="rp-slide-header-sub">' + escapeHtml(timeAgo(item.created_at)) + '</div>' +
          (badgeParts.length ? '<div class="rp-context-badges">' + badgeParts.join("") + '</div>' : "") +
        '</div>' +
        (isOwnPost ? "" :
          '<button type="button" class="rp-follow-btn' + (isFollowing ? " following" : "") + '" data-action="follow">' +
            (isFollowing ? "Following" : "Follow") +
          '</button>'
        ) +
        '<div class="rp-more-wrap">' +
          '<button type="button" class="rp-more-btn" data-action="more">•••</button>' +
          '<div class="rp-more-menu" id="rpMore-' + item.id + '">' +
            (isOwnPost ?
              '<button type="button" data-action="edit-post">✏️ Edit category &amp; location</button>' +
              '<button type="button" class="danger" data-action="delete-post">🗑️ Delete post</button>'
              :
              '<button type="button" data-action="message">Message ' + escapeHtml(item.name) + '</button>' +
              '<button type="button" data-action="report">Report post</button>' +
              '<button type="button" class="danger" data-action="block">' + (isBlocked(item.user_id) ? "Unblock" : "Block") + " " + escapeHtml(item.name) + '</button>'
            ) +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="rp-overlay-bottom">' +
        (item.caption ? '<div class="rp-caption">' + escapeHtml(item.caption) + '</div>' : "") +
      '</div>' +
      '<div class="rp-actions" id="rpActions-' + item.id + '"></div>' +
      '<div class="rp-comments-panel" id="rpComments-' + item.id + '"></div>';

    if (item.kind === "video") {
      var videoEl = el.querySelector("video");
      var muteHint = el.querySelector(".rp-mute-hint");
      videoEl.addEventListener("click", function () {
        videoEl.muted = !videoEl.muted;
        if (muteHint) muteHint.style.display = videoEl.muted ? "" : "none";
      });
    }

    wireSlideHeader(item, el);
    renderActions(item, el.querySelector(".rp-actions"));
    return el;
  }

  function wireSlideHeader(item, el) {
    var followBtn = el.querySelector('[data-action="follow"]');
    if (followBtn) {
      followBtn.addEventListener("click", function () { toggleFollow(item.user_id, followBtn); });
    }

    var moreBtn = el.querySelector('[data-action="more"]');
    var moreMenu = el.querySelector('[id="rpMore-' + item.id + '"]');
    if (moreBtn && moreMenu) {
      moreBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var wasOpen = moreMenu.classList.contains("open");
        document.querySelectorAll(".rp-more-menu.open").forEach(function (m) { m.classList.remove("open"); });
        if (!wasOpen) moreMenu.classList.add("open");
      });
    }

    var messageBtn = el.querySelector('[data-action="message"]');
    if (messageBtn) messageBtn.addEventListener("click", function () { openMessageModal(item.user_id, item.name); });

    var reportBtn = el.querySelector('[data-action="report"]');
    if (reportBtn) reportBtn.addEventListener("click", function () {
      openReportModal({ type: "media", id: item.id, label: item.name + "'s post" });
    });

    var blockBtn = el.querySelector('[data-action="block"]');
    if (blockBtn) blockBtn.addEventListener("click", async function () {
      var wasBlocked = isBlocked(item.user_id);
      var result = wasBlocked ? await unblockUser(item.user_id) : await blockUser(item.user_id);
      if (result.error) { alert(result.error); return; }
      if (!wasBlocked) el.remove(); // blocked — their post disappears from the reel immediately
    });

    var editBtn = el.querySelector('[data-action="edit-post"]');
    if (editBtn) editBtn.addEventListener("click", function () { openEditPostModal(item, el); });

    var deletePostBtn = el.querySelector('[data-action="delete-post"]');
    if (deletePostBtn) deletePostBtn.addEventListener("click", async function () {
      if (!confirm("Delete this post? This can't be undone.")) return;
      deletePostBtn.disabled = true;
      var pathsToRemove = [item.storage_path].filter(Boolean);
      if (item.poster_path) pathsToRemove.push(item.poster_path);
      if (pathsToRemove.length) await window.sb.storage.from("media").remove(pathsToRemove);
      await window.sb.from("media").delete().eq("id", item.id);
      loadedItems = loadedItems.filter(function (it) { return it.id !== item.id; });
      el.remove();
    });
  }

  // ---- Edit post (category / location) — lets a member fix or add the
  // workout-type tag on their own posts after the fact, so older untagged
  // posts (and anything mis-tagged) can still land in the right filter. ----
  var EDIT_CATEGORY_OPTIONS = ["Working Out", "Walking", "Hiking", "Biking", "Running", "Swimming", "Meal Prep", "Other"];
  var editPostTarget = null; // { item, slideEl }

  function injectEditPostModal() {
    if (document.getElementById("rpEditPostOverlay")) return;
    var optionsHtml = '<option value="">Choose a category…</option>' +
      EDIT_CATEGORY_OPTIONS.map(function (c) { return '<option value="' + c + '">' + c + '</option>'; }).join("");
    var wrap = document.createElement("div");
    wrap.innerHTML =
      '<div class="simple-modal-overlay" id="rpEditPostOverlay">' +
        '<div class="simple-modal">' +
          '<button type="button" class="simple-modal-close" id="rpEditPostClose" aria-label="Close">&times;</button>' +
          '<div class="eyebrow">Edit Post</div>' +
          '<h3 style="margin-bottom:10px;">What is this post?</h3>' +
          '<div class="form-msg" id="rpEditPostMsg"></div>' +
          '<label for="rpEditPostCategory">Category</label>' +
          '<select id="rpEditPostCategory">' + optionsHtml + '</select>' +
          '<label for="rpEditPostLocation">Location (optional)</label>' +
          '<input type="text" id="rpEditPostLocation" maxlength="80" placeholder="e.g. Riverside Park" />' +
          '<button type="button" class="btn btn-primary btn-block" id="rpEditPostSaveBtn" style="margin-top:12px;">Save</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(wrap.firstChild);

    document.getElementById("rpEditPostClose").addEventListener("click", closeEditPostModal);
    document.getElementById("rpEditPostOverlay").addEventListener("click", function (e) {
      if (e.target.id === "rpEditPostOverlay") closeEditPostModal();
    });
    document.getElementById("rpEditPostSaveBtn").addEventListener("click", saveEditPost);
  }

  function openEditPostModal(item, slideEl) {
    injectEditPostModal();
    editPostTarget = { item: item, slideEl: slideEl };
    document.getElementById("rpEditPostCategory").value = item.workout_type || "";
    document.getElementById("rpEditPostLocation").value = item.location || "";
    var msg = document.getElementById("rpEditPostMsg");
    msg.className = "form-msg";
    document.getElementById("rpEditPostOverlay").classList.add("show");
    document.body.style.overflow = "hidden";
  }

  function closeEditPostModal() {
    var overlay = document.getElementById("rpEditPostOverlay");
    if (overlay) overlay.classList.remove("show");
    document.body.style.overflow = "";
  }

  async function saveEditPost() {
    if (!editPostTarget) return;
    var msg = document.getElementById("rpEditPostMsg");
    var category = document.getElementById("rpEditPostCategory").value;
    var location = document.getElementById("rpEditPostLocation").value.trim();

    if (!category) {
      msg.textContent = "Please choose a category so this post shows up in the right filter.";
      msg.className = "form-msg show error";
      return;
    }

    var btn = document.getElementById("rpEditPostSaveBtn");
    btn.disabled = true;
    btn.textContent = "Saving…";

    var item = editPostTarget.item;
    var { error } = await window.sb.from("media")
      .update({ workout_type: category, location: location || null })
      .eq("id", item.id);

    btn.disabled = false;
    btn.textContent = "Save";

    if (error) {
      msg.textContent = error.message || "Couldn't save — please try again.";
      msg.className = "form-msg show error";
      return;
    }

    item.workout_type = category;
    item.location = location;

    var newEl = buildSlide(item);
    editPostTarget.slideEl.replaceWith(newEl);
    reelObserver.observe(newEl);
    editPostTarget.slideEl = newEl;

    closeEditPostModal();
  }

  document.addEventListener("click", function () {
    document.querySelectorAll(".rp-more-menu.open").forEach(function (m) { m.classList.remove("open"); });
  });

  async function toggleFollow(userId, btn) {
    btn.disabled = true;
    if (followingIds.has(userId)) {
      var { error } = await window.sb.from("follows").delete().eq("follower_id", currentUserId).eq("followee_id", userId);
      if (!error) followingIds.delete(userId);
    } else {
      var { error } = await window.sb.from("follows").insert({ follower_id: currentUserId, followee_id: userId });
      if (!error) followingIds.add(userId);
    }
    btn.disabled = false;
    var nowFollowing = followingIds.has(userId);
    btn.textContent = nowFollowing ? "Following" : "Follow";
    btn.classList.toggle("following", nowFollowing);
  }

  async function renderActions(item, container) {
    container.innerHTML = REACTIONS.map(function (r) {
      return '<button type="button" class="rp-action-btn" data-reaction="' + r.type + '">' +
        '<span class="rp-action-emoji">' + r.emoji + '</span><span class="rp-action-count"></span></button>';
    }).join("") +
      '<button type="button" class="rp-action-btn rp-comment-btn" data-action="comments">' +
      '<span class="rp-action-emoji">💬</span><span class="rp-action-count"></span></button>';

    var commentBtn = container.querySelector(".rp-comment-btn");
    commentBtn.addEventListener("click", function () { toggleCommentsPanel(item); });

    var [{ data: reactions }, { count: commentCount }] = await Promise.all([
      window.sb.from("media_reactions").select("user_id, reaction_type").eq("media_id", item.id),
      window.sb.from("media_comments").select("id", { count: "exact", head: true }).eq("media_id", item.id)
    ]);

    var counts = { thumbs_up: 0, muscle: 0, heart: 0 };
    var mine = {};
    (reactions || []).forEach(function (r) {
      if (counts[r.reaction_type] !== undefined) counts[r.reaction_type]++;
      if (currentUserId && r.user_id === currentUserId) mine[r.reaction_type] = true;
    });

    REACTIONS.forEach(function (r) {
      var btn = container.querySelector('[data-reaction="' + r.type + '"]');
      if (!btn) return;
      btn.classList.toggle("active", !!mine[r.type]);
      btn.querySelector(".rp-action-count").textContent = counts[r.type] || "";
      btn.addEventListener("click", function () { toggleReaction(item.id, r.type, btn); });
    });

    commentBtn.querySelector(".rp-action-count").textContent = commentCount || "";
  }

  async function toggleReaction(mediaId, type, btn) {
    if (!currentUserId) return;
    var isActive = btn.classList.contains("active");
    var countEl = btn.querySelector(".rp-action-count");
    var current = parseInt(countEl.textContent || "0", 10) || 0;
    if (isActive) {
      btn.classList.remove("active");
      countEl.textContent = (current - 1) > 0 ? current - 1 : "";
      await window.sb.from("media_reactions").delete()
        .eq("media_id", mediaId).eq("user_id", currentUserId).eq("reaction_type", type);
    } else {
      btn.classList.add("active");
      countEl.textContent = current + 1;
      await window.sb.from("media_reactions").insert({ media_id: mediaId, user_id: currentUserId, reaction_type: type });
    }
  }

  function toggleCommentsPanel(item) {
    var panel = document.getElementById("rpComments-" + item.id);
    var isOpen = panel.classList.contains("open");
    document.querySelectorAll(".rp-comments-panel.open").forEach(function (p) { p.classList.remove("open"); });
    if (!isOpen) {
      panel.classList.add("open");
      loadComments(item, panel);
    }
  }

  async function loadComments(item, panel) {
    panel.innerHTML =
      '<div class="rp-comments-header"><span>Comments</span><button type="button" class="rp-comments-close">✕</button></div>' +
      '<div class="rp-comments-list">Loading…</div>';
    panel.querySelector(".rp-comments-close").addEventListener("click", function () { panel.classList.remove("open"); });

    var { data: comments } = await window.sb
      .from("media_comments")
      .select("id, user_id, body, created_at, profiles(display_name)")
      .eq("media_id", item.id)
      .order("created_at", { ascending: true });
    var visible = filterOutBlocked(comments || []);

    var listHtml = visible.length
      ? visible.map(function (c) {
          var name = (c.profiles && c.profiles.display_name) || "A member";
          return '<div class="rp-comment-item"><span class="rp-comment-name">' + escapeHtml(name) + '</span>' +
            '<span class="rp-comment-time">' + timeAgo(c.created_at) + '</span>' +
            '<div class="rp-comment-body">' + escapeHtml(c.body) + '</div></div>';
        }).join("")
      : '<div class="rp-comment-empty">Be the first to comment.</div>';

    var listEl = panel.querySelector(".rp-comments-list");
    listEl.innerHTML = listHtml;

    if (currentUserId) {
      var inputRow = document.createElement("div");
      inputRow.className = "rp-comment-input-row";
      inputRow.innerHTML =
        '<input type="text" class="rp-comment-input" maxlength="300" placeholder="Add a comment…" />' +
        '<button type="button" class="rp-comment-send">Post</button>';
      panel.appendChild(inputRow);
      inputRow.querySelector(".rp-comment-send").addEventListener("click", function () { postComment(item, panel); });
      inputRow.querySelector(".rp-comment-input").addEventListener("keydown", function (e) {
        if (e.key === "Enter") postComment(item, panel);
      });
    }
  }

  async function postComment(item, panel) {
    var input = panel.querySelector(".rp-comment-input");
    var body = input.value.trim();
    if (!body) return;
    input.value = "";
    await window.sb.from("media_comments").insert({ media_id: item.id, user_id: currentUserId, body: body });
    loadComments(item, panel);
    var countEl = document.querySelector("#rpActions-" + item.id + " .rp-comment-btn .rp-action-count");
    if (countEl) countEl.textContent = (parseInt(countEl.textContent || "0", 10) || 0) + 1;
  }

  // On the phone-frame layout, #rpReel is its own internal scroll
  // container, so the sentinel's visibility has to be measured against it.
  // On the desktop layout, .rp-reel is a normal block in a page that
  // scrolls itself, so the root has to be the viewport (null) instead —
  // scoping it to #rpReel there would never fire since that element no
  // longer scrolls.
  var loadMoreObserver = new IntersectionObserver(function (entries) {
    if (entries[0].isIntersecting) loadMoreReel();
  }, { root: isWideLayout ? null : document.getElementById("rpReel"), threshold: 0.05 });

  async function loadMoreReel() {
    if (loadingMore || reachedEnd) return;
    loadingMore = true;
    var rows = await fetchBatch(false, PAGE_SIZE, offset, activeFilter);
    if (!rows.length) {
      reachedEnd = true;
      loadingMore = false;
      if (loadedItems.length === 0) {
        var reelMsg = lastFetchError
          ? "Couldn't load the feed — " + escapeHtml(lastFetchError.message || String(lastFetchError))
          : (activeFilter !== "All"
              ? "No approved " + escapeHtml(activeFilter) + " posts yet."
              : "Nothing approved yet outside Meal Prep — once videos and photos are reviewed, they'll scroll here.");
        document.getElementById("rpReel").insertAdjacentHTML(
          "afterbegin",
          '<div class="rp-empty-reel">' + reelMsg + '</div>'
        );
      }
      return;
    }
    var items = await buildItems(rows);
    var reel = document.getElementById("rpReel");
    var sentinel = document.getElementById("rpSentinel");
    items.forEach(function (item) {
      loadedItems.push(item);
      var slideEl = buildSlide(item);
      reel.insertBefore(slideEl, sentinel);
      reelObserver.observe(slideEl);
    });
    offset += rows.length;
    reachedEnd = rows.length < PAGE_SIZE;
    loadingMore = false;
  }

  (async function init() {
    var user = await requireAuth();
    if (!user) return;
    currentUserId = user.id;
    setModerationUser(currentUserId);
    setMessageSender(currentUserId);
    await loadBlockedIds();

    var { data: followRows } = await window.sb.from("follows").select("followee_id").eq("follower_id", currentUserId);
    followingIds = new Set((followRows || []).map(function (r) { return r.followee_id; }));

    var mealPrepRows = await fetchBatch(true, 20, 0);
    mealPrepItems = await buildItems(mealPrepRows);
    usingIllustrativeMealPrep = !mealPrepItems.length && !lastFetchError;
    if (usingIllustrativeMealPrep) {
      mealPrepItems = ILLUSTRATIVE_MEAL_PREP.map(function (it, i) {
        return {
          id: "illustrative-" + i,
          user_id: "",
          kind: "photo",
          url: "assets/mealprep/" + it.file,
          posterUrl: "",
          name: it.name,
          created_at: new Date().toISOString(),
          workout_type: "Meal Prep",
          location: "",
          caption: it.caption
        };
      });
    }
    renderMealPrepStrip();

    renderFilters();
    await loadMoreReel();
    loadMoreObserver.observe(document.getElementById("rpSentinel"));

    // Desktop-dashboard-only content — skipped entirely on the phone
    // layout so the mobile app makes no extra network calls for panels
    // it never shows.
    if (isWideLayout) {
      var { data: profile } = await window.sb.from("profiles").select("display_name").eq("id", currentUserId).maybeSingle();
      var nameEl = document.getElementById("rpDashName");
      if (nameEl && profile && profile.display_name) nameEl.textContent = ", " + profile.display_name;
      loadFitPlusPanel();
      loadQuotePanel();
      loadMusicPanel();
      loadBooksPanel();
    }
  })();

  // ---------------- Desktop sidebar panels (Quotes / Music / Books) ------
  // Real content from the same tables their own library pages use — no
  // invented data — just a small preview here with a link through to the
  // full page for each.
  // Fitness+ is the matching/dating feature ("Find Your Person" — matched
  // on ZIP code and wake-up time, per fitness-plus.html) and the one Ken
  // has flagged as the revenue driver, so it leads the sidebar. Real
  // match counts computed the same way fitness-plus.html itself does —
  // no fabricated people or numbers.
  async function loadFitPlusPanel() {
    var panel = document.getElementById("rpFitPlusPanel");
    if (!panel) return;
    var { data: mine } = await window.sb
      .from("profiles")
      .select("zip_code, wake_time_category")
      .eq("id", currentUserId)
      .maybeSingle();
    var myZip = (mine && mine.zip_code) || "";
    var myWake = (mine && mine.wake_time_category) || "";

    var { data: others, error } = await window.sb
      .from("profiles")
      .select("id, zip_code, wake_time_category")
      .neq("id", currentUserId);

    var great = 0, partial = 0;
    (!error && others ? others : []).forEach(function (m) {
      var sameZip = !!myZip && m.zip_code === myZip;
      var sameWake = !!myWake && m.wake_time_category === myWake;
      if (sameZip && sameWake) great++;
      else if (sameZip || sameWake) partial++;
    });

    var headline, sub;
    if (!myZip || !myWake) {
      headline = "Complete your profile to unlock matches";
      sub = "Add your ZIP code and wake-up time on My Profile to see who you match with.";
    } else if (great > 0) {
      headline = great + " great match" + (great === 1 ? "" : "es") + " waiting";
      sub = "Same ZIP code and wake-up time as you.";
    } else if (partial > 0) {
      headline = partial + " potential match" + (partial === 1 ? "" : "es") + " nearby";
      sub = "Shares a ZIP code or wake-up time with you.";
    } else {
      headline = "Find Your Person";
      sub = "Matched on your ZIP code and the time you naturally wake up.";
    }

    panel.innerHTML =
      '<div class="rp-panel-head"><span class="rp-panel-icon">❤️</span><span class="rp-panel-title">Fitness+</span></div>' +
      '<div class="rp-quote-text">' + escapeHtml(headline) + '</div>' +
      '<div class="rp-quote-author">' + escapeHtml(sub) + '</div>' +
      '<a class="rp-panel-link" href="fitness-plus.html">Find Your Person →</a>';
  }

  async function loadQuotePanel() {
    var panel = document.getElementById("rpQuotePanel");
    if (!panel) return;
    var { data, error } = await window.sb
      .from("quotes")
      .select("quote_text, author")
      .eq("is_active", true)
      .order("created_at", { ascending: false })
      .limit(1);
    var q = !error && data && data[0];
    panel.innerHTML =
      '<div class="rp-panel-head"><span class="rp-panel-icon">✨</span><span class="rp-panel-title">Daily Inspiration</span></div>' +
      (q
        ? '<div class="rp-quote-text">“' + escapeHtml(q.quote_text) + '”</div>' +
          (q.author ? '<div class="rp-quote-author">— ' + escapeHtml(q.author) + '</div>' : '')
        : '<div class="rp-panel-empty">New quotes coming soon.</div>') +
      '<a class="rp-panel-link" href="quote-library.html">Browse the Quote Library →</a>';
  }

  async function loadMusicPanel() {
    var panel = document.getElementById("rpMusicPanel");
    if (!panel) return;
    var { data, error } = await window.sb
      .from("tracks")
      .select("title, artist_name")
      .eq("is_active", true)
      .order("title", { ascending: true })
      .limit(3);
    var rows = (!error && data ? data : []).map(function (t) {
      return '<div class="rp-mini-row"><span class="rp-mini-dot">🎵</span><div><div class="rp-mini-title">' +
        escapeHtml(t.title) + '</div><div class="rp-mini-sub">' + escapeHtml(t.artist_name || "") + '</div></div></div>';
    }).join("");
    panel.innerHTML =
      '<div class="rp-panel-head"><span class="rp-panel-icon">🎧</span><span class="rp-panel-title">Music Library</span></div>' +
      (rows || '<div class="rp-panel-empty">Tracks coming soon.</div>') +
      '<a class="rp-panel-link" href="music-library.html">Open Music Library →</a>';
  }

  async function loadBooksPanel() {
    var panel = document.getElementById("rpBooksPanel");
    if (!panel) return;
    var { data, error } = await window.sb
      .from("books")
      .select("title, author_name, cover_storage_path")
      .eq("is_active", true)
      .order("created_at", { ascending: false })
      .limit(3);
    var cards = (!error && data ? data : []).map(function (b) {
      var cover = b.cover_storage_path
        ? window.SUPABASE_URL + "/storage/v1/object/public/book-covers/" + b.cover_storage_path
        : "";
      return '<div class="rp-book-card">' +
        (cover ? '<img src="' + cover + '" alt="" />' : '<div class="rp-book-fallback">📖</div>') +
        '<div class="rp-book-title">' + escapeHtml(b.title) + '</div></div>';
    }).join("");
    panel.innerHTML =
      '<div class="rp-panel-head"><span class="rp-panel-icon">📚</span><span class="rp-panel-title">Motivational Books</span></div>' +
      '<div class="rp-book-row">' + (cards || '<div class="rp-panel-empty">New titles coming soon.</div>') + '</div>' +
      '<a class="rp-panel-link" href="https://ensemblefitness.com/books.html" target="_blank" rel="noopener">Browse all books →</a>';
  }
</script>
</body>
</html>
