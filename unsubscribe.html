<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Daily note preferences | Ensemble Fitness</title>
<style>
  html,body{margin:0;padding:0;background:#0f1014;color:#f2f3f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box;}
  .card{width:100%;max-width:440px;background:#1a1c23;border:1px solid #2c2f3a;border-radius:20px;padding:28px 24px;text-align:center;}
  .brand{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#ff8a5e;font-weight:700;margin:0 0 14px;}
  h1{font-size:22px;line-height:1.3;margin:0 0 10px;color:#fff;}
  p{font-size:16px;line-height:1.5;margin:0 0 20px;color:#d6d8e0;}
  button{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:999px;padding:14px 26px;cursor:pointer;background:#ff6b3d;color:#fff;min-width:220px;}
  button.ghost{background:transparent;color:#f2f3f7;border:1.5px solid #5a5f70;}
  button:disabled{opacity:.6;cursor:default;}
  a{color:#ff8a5e;}
  .small{font-size:14px;color:#aeb2c0;margin-top:18px;margin-bottom:0;}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="card">
  <p class="brand">Ensemble Fitness</p>
  <h1 id="title">Loading…</h1>
  <p id="msg"></p>
  <div id="actions"></div>
  <p class="small"><a href="https://app.ensemblefitness.com/">Go to Ensemble Fitness</a></p>
</div></div>

<script src="js/vendor/supabase.js"></script>
<script>window.supabase||document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"><\/script>')</script>
<script>
(function () {
  var SUPABASE_URL = "https://wgrldwdgvvlhcmlyoxrl.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_4sbGE70Sh5gkgpmBqdGVBg_VkqjzJVx";
  var token = new URLSearchParams(location.search).get("t") || "";
  var okToken = /^[0-9a-fA-F-]{36}$/.test(token);
  var titleEl = document.getElementById("title"), msgEl = document.getElementById("msg"), actEl = document.getElementById("actions");
  var sb = null;
  try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } }); } catch (e) {}

  function show(title, msg, label, ghost, handler) {
    titleEl.textContent = title; msgEl.textContent = msg; actEl.innerHTML = "";
    if (!label) return;
    var b = document.createElement("button");
    b.type = "button"; b.textContent = label; if (ghost) b.className = "ghost";
    b.addEventListener("click", function () { b.disabled = true; handler(b); });
    actEl.appendChild(b);
  }
  function problem() {
    show("Something went wrong", "We couldn't update your preference just now. Please try again in a minute.", "Try again", false, function () { location.reload(); });
  }
  function ask() {
    show("Stop the daily note?", "You'll stop getting the Ensemble Fitness inspirational note each morning. You can turn it back on any time.", "Unsubscribe", false, function () {
      sb.rpc("unsubscribe_daily_note", { p_token: token }).then(function (r) {
        if (r.error || r.data !== true) return problem();
        done();
      }, problem);
    });
  }
  function done() {
    show("You're unsubscribed", "You won't get the daily note anymore. Changed your mind?", "Turn the daily note back on", true, function () {
      sb.rpc("resubscribe_daily_note", { p_token: token }).then(function (r) {
        if (r.error || r.data !== true) return problem();
        show("Welcome back", "You'll get tomorrow morning's note.", "", false, null);
      }, problem);
    });
  }
  if (!okToken || !sb) {
    show("This link doesn't look right", "Please use the Unsubscribe link from the bottom of your daily note email.", "", false, null);
  } else {
    ask();
  }
})();
</script>
</body>
</html>
